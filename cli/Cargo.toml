[package]
name = "datafusion-distributed-cli"
version = "0.1.0"
edition = "2024"
description = "DataFusion's CLI with distributed execution capabilities, and a viewer for DataFusion Distributed plan dumps"
license = "Apache-2.0"
documentation = "https://datafusion-contrib.github.io/datafusion-distributed/"
repository = "https://github.com/datafusion-contrib/datafusion-distributed"
readme = "README.md"

[dependencies]
datafusion = { workspace = true }
datafusion-distributed = { path = "..", version = "4.0.0", features = ["avro", "integration"] }
datafusion-cli = { version = "55", default-features = false }
tokio = { version = "1.48", features = ["full"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
dirs = "6"

[[bin]]
name = "dfd"
path = "src/main.rs"
