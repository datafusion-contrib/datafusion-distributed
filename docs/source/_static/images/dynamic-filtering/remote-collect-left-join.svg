<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Remote dynamic filtering for a CollectLeft hash join</title>
  <desc id="desc">One Stage 1 build task scans the dimension table. Its complete build side is broadcast to every CollectLeft hash join task, so their filters are equivalent. The coordinator accepts the first completed filter, then four Stage 2 probe tasks apply it while scanning the fact table.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b949e"/></marker>
    <marker id="filter-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d74633"/></marker>
    <style>
      .scene{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.heading{fill:#24292f;font-size:15px;font-weight:650}.label{fill:#57606a;font-size:12px}.small{fill:#57606a;font-size:10.5px}.stage{fill:#6e7781;font-size:11px;font-weight:700;letter-spacing:.08em}.join-task{fill:#f6f8fa;stroke:#d8dee4;stroke-width:1.5}.build-task{fill:#eaf3ff;stroke:#218bff;stroke-width:1.8}.probe-task{fill:#edfff2;stroke:#2da44e;stroke-width:1.8}.coord{fill:#fff8f5;stroke:#d74633;stroke-width:1.5}.network{fill:#eef2f6;stroke:#afb8c1;stroke-width:1.2}.data-flow{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#data-arrow)}.filter-up{fill:none;stroke:#d74633;stroke-width:2;marker-end:url(#filter-arrow)}.filter-bus{fill:none;stroke:#d74633;stroke-width:2}.filter-down{fill:none;stroke:#d74633;stroke-width:2;marker-end:url(#filter-arrow)}.row rect{fill:#eef2f6;stroke:#d0d7de}.row text{fill:#24292f;font-size:11px;text-anchor:middle}.build-row rect{fill:#dbeafe;stroke:#218bff}.keep rect{fill:#dafbe1;stroke:#4ac26b}.packet rect{fill:#fff1e5;stroke:#d74633;stroke-width:1.4}.packet text{fill:#9a2f22;font-size:10.5px;font-weight:650;text-anchor:middle}.data-chip rect{fill:#fff;stroke:#8b949e;stroke-width:1.2}.data-chip text{fill:#24292f;font-size:9px;font-weight:650;text-anchor:middle}
      .build-phase{animation:buildPhase 10s linear infinite}.probe-phase{opacity:0;animation:probePhase 10s linear infinite}.build-chip{opacity:0;animation:buildUp 10s ease-in-out infinite}.probe-chip{opacity:0;animation:probeUp 10s ease-in-out infinite}.hash-ready{opacity:0;animation:hashReady 10s linear infinite}.first{opacity:0;animation:first 10s ease-in-out infinite}.accepted{opacity:0;animation:accepted 10s linear infinite}.filter-route{opacity:0;stroke-dasharray:1300;stroke-dashoffset:1300;animation:filterRoute 10s linear infinite}.filter-branches{opacity:0;animation:filterBranches 10s linear infinite}.scan-filter{opacity:0;animation:scanFilter 10s linear infinite}.drop{animation:reject 10s linear infinite}.strike{opacity:0;animation:strike 10s linear infinite}.status-build{opacity:0;animation:statusBuild 10s linear infinite}.status-first{opacity:0;animation:statusFirst 10s linear infinite}.status-switch{opacity:0;animation:statusSwitch 10s linear infinite}.status-probe{opacity:0;animation:statusProbe 10s linear infinite}
      @keyframes buildPhase{0%,38%{opacity:1}44%,100%{opacity:0}}
      @keyframes probePhase{0%,42%{opacity:0}48%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes buildUp{0%,4%{opacity:0;transform:translateY(0)}7%,12%{opacity:1}19%,100%{opacity:0;transform:translateY(-165px)}}
      @keyframes probeUp{0%,67%{opacity:0;transform:translateY(0)}70%,78%{opacity:1}87%,100%{opacity:0;transform:translateY(-190px)}}
      @keyframes hashReady{0%,16%{opacity:0}20%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes first{0%,20%{opacity:0;transform:translate(0,0)}23%,31%{opacity:1}36%,100%{opacity:0;transform:translate(-12px,-57px)}}
      @keyframes accepted{0%,33%{opacity:0}37%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes filterRoute{0%,35%{opacity:0;stroke-dashoffset:1300}38%{opacity:1;stroke-dashoffset:1300}53%,94%{opacity:1;stroke-dashoffset:0}99%,100%{opacity:0;stroke-dashoffset:0}}
      @keyframes filterBranches{0%,50%{opacity:0}54%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes scanFilter{0%,53%{opacity:0}57%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes reject{0%,54%{opacity:1}59%,94%{opacity:.18}99%,100%{opacity:1}}
      @keyframes strike{0%,54%{opacity:0}59%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes statusBuild{0%,3%{opacity:0}6%,20%{opacity:1}24%,100%{opacity:0}}
      @keyframes statusFirst{0%,21%{opacity:0}25%,40%{opacity:1}44%,100%{opacity:0}}
      @keyframes statusSwitch{0%,41%{opacity:0}45%,64%{opacity:1}68%,100%{opacity:0}}
      @keyframes statusProbe{0%,65%{opacity:0}69%,94%{opacity:1}99%,100%{opacity:0}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.build-phase,.build-chip,.probe-chip,.first,.status-build,.status-first,.status-switch{opacity:0}.probe-phase,.hash-ready,.accepted,.filter-route,.filter-branches,.scan-filter,.strike,.status-probe{opacity:1}.filter-route{stroke-dashoffset:0}.drop{opacity:.18}}
    </style>
  </defs>
  <g class="scene">
    <rect width="960" height="620" rx="16" fill="#fbfcfd"/><text x="30" y="33" class="heading">CollectLeft Join: The First Complete Copy Is Enough</text><text x="930" y="33" class="label" text-anchor="end">10-second loop</text>
    <text x="30" y="94" class="stage">COORDINATOR</text><rect x="330" y="52" width="410" height="103" rx="12" class="coord"/><text x="350" y="79" class="heading">Query coordinator</text><g class="accepted"><circle cx="357" cy="127" r="5" fill="#2da44e"/><text x="370" y="131" class="small mono">accept F₁</text></g>
    <text x="30" y="245" class="stage">STAGE 3</text>
    <rect x="175" y="190" width="285" height="125" rx="12" class="join-task"/><text x="193" y="217" class="heading">Hash Join task 0</text><text x="193" y="239" class="label">replicated build · complete</text><g class="hash-ready"><g class="row build-row" transform="translate(193 253)"><rect width="42" height="27" rx="7"/><text x="21" y="18">B</text></g><g class="row build-row" transform="translate(243 253)"><rect width="42" height="27" rx="7"/><text x="21" y="18">D</text></g><text x="193" y="299" class="small mono">F₀ = key IN (B, D)</text></g>
    <rect x="500" y="190" width="285" height="125" rx="12" class="join-task"/><text x="518" y="217" class="heading">Hash Join task 1</text><text x="518" y="239" class="label">same replicated build · complete</text><g class="hash-ready"><g class="row build-row" transform="translate(518 253)"><rect width="42" height="27" rx="7"/><text x="21" y="18">B</text></g><g class="row build-row" transform="translate(568 253)"><rect width="42" height="27" rx="7"/><text x="21" y="18">D</text></g><text x="518" y="299" class="small mono">F₁ = key IN (B, D)</text></g>
    <path d="M310 190L430 155" class="filter-up"/><path d="M650 190L640 155" class="filter-up"/><g transform="translate(621 177)"><g class="packet first"><rect width="58" height="24" rx="7"/><text x="29" y="16">F₁ ✓</text></g></g>
    <rect x="130" y="350" width="700" height="34" rx="10" class="network"/><text x="480" y="372" class="small mono build-phase" text-anchor="middle">Broadcast · every join receives the complete Stage 1 build side</text><text x="480" y="372" class="small mono probe-phase" text-anchor="middle">Network shuffle · filtered Stage 2 probe rows move upward</text><path d="M290 350V315" class="data-flow"/><path d="M615 350V315" class="data-flow"/>
    <path d="M740 103H925V407H135" class="filter-bus filter-route"/><g class="filter-branches"><g class="packet" transform="translate(875 255)"><rect width="42" height="24" rx="7"/><text x="21" y="16">F₁</text></g><path d="M225 407V425" class="filter-down"/><path d="M430 407V425" class="filter-down"/><path d="M635 407V425" class="filter-down"/><path d="M840 407V425" class="filter-down"/></g>
    <g class="build-phase">
      <text x="30" y="417" class="stage">STAGE 1</text>
      <path d="M480 425V384" class="data-flow"/>
      <rect x="370" y="425" width="220" height="125" rx="12" class="build-task"/><text x="388" y="451" class="heading">Build task</text><text x="388" y="470" class="label">Data Source · dim</text><g class="row build-row" transform="translate(388 486)"><rect width="52" height="30" rx="7"/><text x="26" y="20">B</text></g><g class="row build-row" transform="translate(448 486)"><rect width="52" height="30" rx="7"/><text x="26" y="20">D</text></g>
      <g transform="translate(459 491)"><g class="data-chip build-chip"><rect width="42" height="20" rx="5"/><text x="21" y="14">B,D</text></g></g>
    </g>
    <g class="probe-phase">
      <text x="30" y="417" class="stage">STAGE 2</text>
      <path d="M175 425V384" class="data-flow"/><path d="M380 425V384" class="data-flow"/><path d="M585 425V384" class="data-flow"/><path d="M790 425V384" class="data-flow"/>
      <rect x="110" y="425" width="180" height="125" rx="12" class="probe-task"/><text x="126" y="451" class="heading">Probe task 0</text><text x="126" y="470" class="label">Data Source · fact</text><text x="126" y="488" class="small mono scan-filter">key ∈ {B,D}</text><g class="row drop" transform="translate(126 502)"><rect width="52" height="30" rx="7"/><text x="26" y="20">A</text></g><g class="row keep" transform="translate(186 502)"><rect width="52" height="30" rx="7"/><text x="26" y="20">B</text></g><g class="strike" stroke="#cf222e" stroke-width="2.4"><path d="M135 517h34"/></g>
      <rect x="315" y="425" width="180" height="125" rx="12" class="probe-task"/><text x="331" y="451" class="heading">Probe task 1</text><text x="331" y="470" class="label">Data Source · fact</text><text x="331" y="488" class="small mono scan-filter">key ∈ {B,D}</text><g class="row drop" transform="translate(331 502)"><rect width="52" height="30" rx="7"/><text x="26" y="20">C</text></g><g class="row keep" transform="translate(391 502)"><rect width="52" height="30" rx="7"/><text x="26" y="20">D</text></g><g class="strike" stroke="#cf222e" stroke-width="2.4"><path d="M340 517h34"/></g>
      <rect x="520" y="425" width="180" height="125" rx="12" class="probe-task"/><text x="536" y="451" class="heading">Probe task 2</text><text x="536" y="470" class="label">Data Source · fact</text><text x="536" y="488" class="small mono scan-filter">key ∈ {B,D}</text><g class="row drop" transform="translate(536 502)"><rect width="52" height="30" rx="7"/><text x="26" y="20">E</text></g><g class="row drop" transform="translate(596 502)"><rect width="52" height="30" rx="7"/><text x="26" y="20">F</text></g><g class="strike" stroke="#cf222e" stroke-width="2.4"><path d="M545 517h34M605 517h34"/></g>
      <rect x="725" y="425" width="180" height="125" rx="12" class="probe-task"/><text x="741" y="451" class="heading">Probe task 3</text><text x="741" y="470" class="label">Data Source · fact</text><text x="741" y="488" class="small mono scan-filter">key ∈ {B,D}</text><g class="row drop" transform="translate(741 502)"><rect width="52" height="30" rx="7"/><text x="26" y="20">G</text></g><g class="row drop" transform="translate(801 502)"><rect width="52" height="30" rx="7"/><text x="26" y="20">H</text></g><g class="strike" stroke="#cf222e" stroke-width="2.4"><path d="M750 517h34M810 517h34"/></g>
      <g transform="translate(195 507)"><g class="data-chip probe-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">B</text></g></g><g transform="translate(400 507)"><g class="data-chip probe-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">D</text></g></g>
    </g>
    <g transform="translate(480 590)" text-anchor="middle"><text class="status-build label">One Stage 1 task scans dim; its complete build side is broadcast to every join.</text><text class="status-first label">Both joins can produce {B,D}, so the coordinator accepts the first report.</text><text class="status-switch label">Stage 2 probe tasks start and receive the filter without waiting for F₀.</text><text class="status-probe label">Probe tasks apply {B,D} and send only surviving fact rows upward.</text></g>
  </g>
</svg>
