<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" role="img" aria-labelledby="title desc">
  <title id="title">Incremental remote dynamic filtering for a TopK sort</title>
  <desc id="desc">Four scans feed two local TopK sorts. A SortPreservingMerge combines their sorted candidates in the next stage. The local sorts report independently safe lower bounds, which the coordinator intersects with AND and sends back to the scans.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b949e"/></marker>
    <marker id="filter-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d74633"/></marker>
    <style>
      .scene{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.heading{fill:#24292f;font-size:15px;font-weight:650}.label{fill:#57606a;font-size:12px}.small{fill:#57606a;font-size:10.5px}.stage{fill:#6e7781;font-size:11px;font-weight:700;letter-spacing:.08em}.panel{fill:#fff;stroke:#d8dee4;stroke-width:1.5}.producer{fill:#f6f8fa;stroke:#d8dee4;stroke-width:1.5}.final{fill:#f0f7ff;stroke:#54aeff;stroke-width:1.5}.coord{fill:#fff8f5;stroke:#d74633;stroke-width:1.5}.network{fill:#eef2f6;stroke:#afb8c1;stroke-width:1.2}.data-flow{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#data-arrow)}.filter-up{fill:none;stroke:#d74633;stroke-width:2;marker-end:url(#filter-arrow)}.uplink{opacity:0;animation:uplink 12s linear infinite}.filter-bus{fill:none;stroke:#d74633;stroke-width:2}.filter-down{fill:none;stroke:#d74633;stroke-width:2;marker-end:url(#filter-arrow)}.row rect{fill:#eef2f6;stroke:#d0d7de}.row text{fill:#24292f;font-size:11px;text-anchor:middle}.keep rect{fill:#dafbe1;stroke:#4ac26b}.packet rect{fill:#fff1e5;stroke:#d74633;stroke-width:1.4}.packet text{fill:#9a2f22;font-size:10px;font-weight:650;text-anchor:middle}.data-chip rect{fill:#eaeef2;stroke:#afb8c1}.data-chip text{fill:#57606a;font-size:9px;text-anchor:middle}
      .progress-track{fill:#dbeafe}.progress-fill{fill:#218bff;transform-box:fill-box;transform-origin:left center;animation:progress 12s linear infinite}
      .data-chip{opacity:0;animation:dataUp 12s ease-in-out infinite}.local-g1{opacity:0;animation:localG1 12s linear infinite}.final-g1{opacity:0;animation:finalG1 12s linear infinite}.report-g1{opacity:0;animation:reportG1 12s linear infinite}.merged-g1{opacity:0;animation:mergedG1 12s linear infinite}.local-g2{opacity:0;animation:localG2 12s linear infinite}.final-g2{opacity:0;animation:finalG2 12s linear infinite}.report-g2{opacity:0;animation:reportG2 12s linear infinite}.merged-g2{opacity:0;animation:mergedG2 12s linear infinite}.downlink-route{opacity:0;stroke-dasharray:1800;stroke-dashoffset:1800;animation:downlinkRoute 12s linear infinite}.downlink-branches{opacity:0;animation:downlinkBranches 12s linear infinite}.filter-true{animation:filterTrue 12s linear infinite}.filter-early{opacity:0;animation:filterEarly 12s linear infinite}.filter-late{opacity:0;animation:filterLate 12s linear infinite}.drop-early{animation:dropEarly 12s linear infinite}.drop-late{animation:dropLate 12s linear infinite}.strike-early{opacity:0;animation:strikeEarly 12s linear infinite}.strike-late{opacity:0;animation:strikeLate 12s linear infinite}.status-data{opacity:0;animation:statusData 12s linear infinite}.status-first{opacity:0;animation:statusFirst 12s linear infinite}.status-early{opacity:0;animation:statusEarly 12s linear infinite}.status-late{opacity:0;animation:statusLate 12s linear infinite}
      @keyframes dataUp{0%,3%{opacity:0;transform:translateY(0)}6%,11%{opacity:1}15%{opacity:0;transform:translateY(-38px)}16%,57%{opacity:0;transform:translateY(0)}60%,63%{opacity:1}65%,100%{opacity:0;transform:translateY(-38px)}}@keyframes localG1{0%,10%{opacity:0}14%,66%{opacity:1}70%,100%{opacity:0}}@keyframes finalG1{0%,17%{opacity:0}21%,70%{opacity:1}74%,100%{opacity:0}}@keyframes uplink{0%,23%{opacity:0}27%,33%{opacity:1}37%,75%{opacity:0}78%,81%{opacity:1}84%,100%{opacity:0}}@keyframes reportG1{0%,24%{opacity:0}28%,32%{opacity:1}36%,100%{opacity:0}}@keyframes mergedG1{0%,31%{opacity:0}35%,81%{opacity:1}85%,100%{opacity:0}}@keyframes localG2{0%,66%{opacity:0}70%,96%{opacity:1}100%{opacity:0}}@keyframes finalG2{0%,70%{opacity:0}74%,96%{opacity:1}100%{opacity:0}}@keyframes reportG2{0%,75%{opacity:0}78%,81%{opacity:1}84%,100%{opacity:0}}@keyframes mergedG2{0%,81%{opacity:0}85%,97%{opacity:1}100%{opacity:0}}@keyframes downlinkRoute{0%,36%{opacity:0;stroke-dashoffset:1800}38%{opacity:1;stroke-dashoffset:1800}50%{opacity:1;stroke-dashoffset:0}54%{opacity:0;stroke-dashoffset:0}55%,86%{opacity:0;stroke-dashoffset:1800}88%{opacity:1;stroke-dashoffset:1800}96%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}@keyframes downlinkBranches{0%,47%{opacity:0}51%,53%{opacity:1}56%,95%{opacity:0}98%,99%{opacity:1}100%{opacity:0}}@keyframes filterTrue{0%,49%{opacity:1}54%,100%{opacity:0}}@keyframes filterEarly{0%,49%{opacity:0}54%,96%{opacity:1}99%,100%{opacity:0}}@keyframes filterLate{0%,96%{opacity:0}99%{opacity:1}100%{opacity:0}}@keyframes dropEarly{0%,49%{opacity:1}54%,99%{opacity:.18}100%{opacity:1}}@keyframes dropLate{0%,96%{opacity:1}99%{opacity:.18}100%{opacity:1}}@keyframes strikeEarly{0%,49%{opacity:0}54%,99%{opacity:1}100%{opacity:0}}@keyframes strikeLate{0%,96%{opacity:0}99%{opacity:1}100%{opacity:0}}@keyframes statusData{0%,3%{opacity:0}6%,16%{opacity:1}20%,100%{opacity:0}}@keyframes statusFirst{0%,17%{opacity:0}21%,32%{opacity:1}36%,100%{opacity:0}}@keyframes statusEarly{0%,33%{opacity:0}37%,56%{opacity:1}60%,100%{opacity:0}}@keyframes statusLate{0%,57%{opacity:0}61%,97%{opacity:1}99%,100%{opacity:0}}
      @keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.data-chip,.local-g1,.final-g1,.report-g1,.merged-g1,.filter-true,.filter-early,.status-data,.status-first,.status-early{opacity:0}.local-g2,.final-g2,.report-g2,.merged-g2,.uplink,.downlink-route,.downlink-branches,.filter-late,.strike-early,.strike-late,.status-late{opacity:1}.downlink-route{stroke-dashoffset:0}.drop-early,.drop-late{opacity:.18}}
    </style>
  </defs>
  <g class="scene">
    <rect width="960" height="750" rx="16" fill="#fbfcfd"/><g aria-label="Animation progress"><rect x="780" y="42" width="150" height="4" rx="2" class="progress-track"/><rect x="780" y="42" width="150" height="4" rx="2" class="progress-fill"/></g>

    <text x="30" y="94" class="stage">COORDINATOR</text><rect x="275" y="52" width="410" height="103" rx="12" class="coord"/><text x="295" y="79" class="heading">Query Coordinator</text><text x="295" y="101" class="label">Incremental · AND latest producer bounds</text><g class="merged-g1"><text x="295" y="129" class="small mono">score &gt; 42 AND score &gt; 52  ⇒  score &gt; 52</text></g><g class="merged-g2"><text x="295" y="129" class="small mono">score &gt; 76 AND score &gt; 73  ⇒  score &gt; 76</text></g>

    <text x="30" y="235" class="stage">STAGE 3</text><rect x="275" y="180" width="410" height="105" rx="12" class="final"/><text x="295" y="207" class="heading">SortPreservingMergeExec · LIMIT 3</text><text x="295" y="229" class="label">Merges locally sorted candidates into the global TopK</text><g class="final-g1"><text x="295" y="259" class="small mono">local TopK streams remain ordered</text></g><g class="final-g2"><text x="295" y="259" class="small mono">global TopK = [99, 90, 82]</text></g>
    <rect x="210" y="300" width="540" height="32" rx="10" class="network"/><text x="480" y="321" class="small mono" text-anchor="middle">NetworkCoalesceExec · locally sorted TopK streams</text><path d="M480 300V285" class="data-flow"/>

    <text x="30" y="410" class="stage">STAGE 2</text><rect x="175" y="350" width="285" height="110" rx="12" class="producer"/><text x="193" y="377" class="heading">Task 0 · SortExec</text><text x="193" y="399" class="label">local ORDER BY score DESC · LIMIT 3</text><g class="local-g1"><text x="193" y="433" class="small mono">generation 1 · score &gt; 42</text></g><g class="local-g2"><text x="193" y="433" class="small mono">generation 2 · score &gt; 76</text></g>
    <rect x="500" y="350" width="285" height="110" rx="12" class="producer"/><text x="518" y="377" class="heading">Task 1 · SortExec</text><text x="518" y="399" class="label">local ORDER BY score DESC · LIMIT 3</text><g class="local-g1"><text x="518" y="433" class="small mono">generation 1 · score &gt; 52</text></g><g class="local-g2"><text x="518" y="433" class="small mono">generation 2 · score &gt; 73</text></g>
    <path d="M317 350V332" class="data-flow"/><path d="M642 350V332" class="data-flow"/>
    <path d="M175 395H90V105H275" class="filter-up uplink"/><path d="M785 395H870V105H685" class="filter-up uplink"/>
    <g class="report-g1 packet" transform="translate(70 246)"><rect width="76" height="24" rx="7"/><text x="38" y="16">&gt; 42 · g1</text></g><g class="report-g2 packet" transform="translate(70 246)"><rect width="76" height="24" rx="7"/><text x="38" y="16">&gt; 76 · g2</text></g><g class="report-g1 packet" transform="translate(814 246)"><rect width="76" height="24" rx="7"/><text x="38" y="16">&gt; 52 · g1</text></g><g class="report-g2 packet" transform="translate(814 246)"><rect width="76" height="24" rx="7"/><text x="38" y="16">&gt; 73 · g2</text></g>

    <rect x="130" y="490" width="700" height="34" rx="10" class="network"/><text x="480" y="512" class="small mono" text-anchor="middle">NetworkShuffleExec · candidate rows</text><path d="M290 490V460" class="data-flow"/><path d="M615 490V460" class="data-flow"/>
    <path d="M685 125H925V537H135" class="filter-bus downlink-route"/><g class="downlink-branches"><path d="M225 537V555" class="filter-down"/><path d="M430 537V555" class="filter-down"/><path d="M635 537V555" class="filter-down"/><path d="M840 537V555" class="filter-down"/></g>

    <text x="30" y="615" class="stage">STAGE 1</text><path d="M200 555V524" class="data-flow"/><path d="M405 555V524" class="data-flow"/><path d="M610 555V524" class="data-flow"/><path d="M815 555V524" class="data-flow"/>
    <g transform="translate(183 540)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g><g transform="translate(388 540)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g><g transform="translate(593 540)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g><g transform="translate(798 540)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g>
    <rect x="110" y="555" width="180" height="125" rx="12" class="panel"/><text x="126" y="581" class="heading">Scan Task 0</text><g transform="translate(126 599)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">score &gt; 52</text><text class="filter-late small mono">score &gt; 76</text></g><g class="row keep" transform="translate(126 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">90</text></g><g class="row drop-late" transform="translate(186 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">58</text></g><g class="strike-late" stroke="#cf222e" stroke-width="2.4"><path d="M195 631h34"/></g>
    <rect x="315" y="555" width="180" height="125" rx="12" class="panel"/><text x="331" y="581" class="heading">Scan Task 1</text><g transform="translate(331 599)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">score &gt; 52</text><text class="filter-late small mono">score &gt; 76</text></g><g class="row drop-early" transform="translate(331 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">21</text></g><g class="row keep" transform="translate(391 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">78</text></g><g class="strike-early" stroke="#cf222e" stroke-width="2.4"><path d="M340 631h34"/></g>
    <rect x="520" y="555" width="180" height="125" rx="12" class="panel"/><text x="536" y="581" class="heading">Scan Task 2</text><g transform="translate(536 599)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">score &gt; 52</text><text class="filter-late small mono">score &gt; 76</text></g><g class="row keep" transform="translate(536 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">82</text></g><g class="row drop-late" transform="translate(596 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">70</text></g><g class="strike-late" stroke="#cf222e" stroke-width="2.4"><path d="M605 631h34"/></g>
    <rect x="725" y="555" width="180" height="125" rx="12" class="panel"/><text x="741" y="581" class="heading">Scan Task 3</text><g transform="translate(741 599)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">score &gt; 52</text><text class="filter-late small mono">score &gt; 76</text></g><g class="row keep" transform="translate(741 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">99</text></g><g class="row drop-early" transform="translate(801 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">45</text></g><g class="strike-early" stroke="#cf222e" stroke-width="2.4"><path d="M810 631h34"/></g>

    <g transform="translate(480 721)" text-anchor="middle"><text class="status-data label">Rows reach the local TopK sorts.</text><text class="status-first label">Local candidates feed SortPreservingMerge while their bounds travel to the coordinator.</text><text class="status-early label">The coordinator intersects &gt; 42 AND &gt; 52, then sends &gt; 52 to every scan.</text><text class="status-late label">The next generation repeats the path and tightens the filter to &gt; 76.</text></g>
  </g>
</svg>
