    <text x="664" y="601" class="query">Q25</text>
    <rect x="734" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q82: Control · parquet=off = 1.00x</title></rect>
    <rect x="752" y="524.0" width="14" height="46.0" rx="2" fill="#55657a" class="bar"><title>Q82: Control · parquet=on = 0.46x</title></rect>
    <rect x="770" y="439.6" width="14" height="130.4" rx="2" fill="#8cc8ff" class="bar"><title>Q82: Dynamic filtering · parquet=off = 1.30x</title></rect>
    <rect x="788" y="467.6" width="14" height="102.4" rx="2" fill="#1771e6" class="bar"><title>Q82: Dynamic filtering · parquet=on = 1.02x</title></rect>
    <text x="768" y="601" class="query">Q82</text>
    <rect x="838" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q17: Control · parquet=off = 1.00x</title></rect>
    <rect x="856" y="470.4" width="14" height="99.6" rx="2" fill="#55657a" class="bar"><title>Q17: Control · parquet=on = 1.00x</title></rect>
    <rect x="874" y="450.2" width="14" height="119.8" rx="2" fill="#8cc8ff" class="bar"><title>Q17: Dynamic filtering · parquet=off = 1.20x</title></rect>
    <rect x="892" y="370.2" width="14" height="199.8" rx="2" fill="#1771e6" class="bar"><title>Q17: Dynamic filtering · parquet=on = 2.00x</title></rect>
    <text x="872" y="601" class="query">Q17</text>
    <rect x="942" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q26: Control · parquet=off = 1.00x</title></rect>
    <rect x="960" y="470.6" width="14" height="99.4" rx="2" fill="#55657a" class="bar"><title>Q26: Control · parquet=on = 0.99x</title></rect>
    <rect x="978" y="436.1" width="14" height="133.9" rx="2" fill="#8cc8ff" class="bar"><title>Q26: Dynamic filtering · parquet=off = 1.34x</title></rect>
    <rect x="996" y="379.8" width="14" height="190.2" rx="2" fill="#1771e6" class="bar"><title>Q26: Dynamic filtering · parquet=on = 1.90x</title></rect>
    <text x="976" y="601" class="query">Q26</text>
    <rect x="1046" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q98: Control · parquet=off = 1.00x</title></rect>
    <rect x="1064" y="479.4" width="14" height="90.6" rx="2" fill="#55657a" class="bar"><title>Q98: Control · parquet=on = 0.91x</title></rect>
    <rect x="1082" y="466.5" width="14" height="103.5" rx="2" fill="#8cc8ff" class="bar"><title>Q98: Dynamic filtering · parquet=off = 1.03x</title></rect>
