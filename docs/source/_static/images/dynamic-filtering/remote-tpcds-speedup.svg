<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Distributed TPC-DS speedup by dynamic filtering and Parquet configuration</title>
  <desc id="desc">Grouped bar chart for ten TPC-DS queries run on twelve nodes. Each query has four bars: control with parquet=off, control with parquet=on, dynamic filtering with parquet=off, and dynamic filtering with parquet=on. Speedups are normalized to control with parquet=off.</desc>
  <style>
    .chart{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .axis{stroke:#667085;stroke-width:1.5}.grid{stroke:#d8dee7;stroke-width:1}.baseline{stroke:#8895a7;stroke-width:1.5;stroke-dasharray:6 5}
    .tick{fill:#57606a;font-size:14px}.query{fill:#24292f;font-size:15px;font-weight:650;text-anchor:middle}
    .axis-title{fill:#344054;font-size:15px;font-weight:650;text-anchor:middle}.legend{fill:#344054;font-size:14px}
    .bar{stroke:#fff;stroke-width:1}
  </style>
  <g class="chart">
    <rect width="1200" height="680" rx="16" fill="#fbfcfd"/>
    <rect x="90" y="42" width="18" height="18" rx="3" fill="#a7b0be"/>
    <text x="117" y="56" class="legend">Control · parquet=off</text>
    <rect x="365" y="42" width="18" height="18" rx="3" fill="#55657a"/>
    <text x="392" y="56" class="legend">Control · parquet=on</text>
    <rect x="640" y="42" width="18" height="18" rx="3" fill="#8cc8ff"/>
    <text x="667" y="56" class="legend">Dynamic filtering · parquet=off</text>
    <rect x="915" y="42" width="18" height="18" rx="3" fill="#1771e6"/>
    <text x="942" y="56" class="legend">Dynamic filtering · parquet=on</text>
    <line x1="88" y1="570" x2="1160" y2="570" class="grid"/>
    <text x="74" y="575" class="tick" text-anchor="end">0x</text>
    <line x1="88" y1="470" x2="1160" y2="470" class="baseline"/>
    <text x="74" y="475" class="tick" text-anchor="end">1x</text>
    <line x1="88" y1="370" x2="1160" y2="370" class="grid"/>
    <text x="74" y="375" class="tick" text-anchor="end">2x</text>
    <line x1="88" y1="270" x2="1160" y2="270" class="grid"/>
    <text x="74" y="275" class="tick" text-anchor="end">3x</text>
    <line x1="88" y1="170" x2="1160" y2="170" class="grid"/>
    <text x="74" y="175" class="tick" text-anchor="end">4x</text>
    <line x1="88" y1="120" x2="88" y2="570" class="axis"/>
    <line x1="88" y1="570" x2="1160" y2="570" class="axis"/>
    <text x="25" y="345" class="axis-title" transform="rotate(-90 25 345)">Speedup</text>

    <rect x="110" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q21: Control · parquet=off = 1.00x</title></rect>
    <rect x="128" y="465.3" width="14" height="104.7" rx="2" fill="#55657a" class="bar"><title>Q21: Control · parquet=on = 1.05x</title></rect>
    <rect x="146" y="237.9" width="14" height="332.1" rx="2" fill="#8cc8ff" class="bar"><title>Q21: Dynamic filtering · parquet=off = 3.32x</title></rect>
    <rect x="164" y="343.7" width="14" height="226.3" rx="2" fill="#1771e6" class="bar"><title>Q21: Dynamic filtering · parquet=on = 2.26x</title></rect>
    <text x="144" y="601" class="query">Q21</text>

    <rect x="214" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q37: Control · parquet=off = 1.00x</title></rect>
    <rect x="232" y="515.1" width="14" height="54.9" rx="2" fill="#55657a" class="bar"><title>Q37: Control · parquet=on = 0.55x</title></rect>
    <rect x="250" y="405.1" width="14" height="164.9" rx="2" fill="#8cc8ff" class="bar"><title>Q37: Dynamic filtering · parquet=off = 1.65x</title></rect>
    <rect x="268" y="438.2" width="14" height="131.8" rx="2" fill="#1771e6" class="bar"><title>Q37: Dynamic filtering · parquet=on = 1.32x</title></rect>
    <text x="248" y="601" class="query">Q37</text>

    <rect x="318" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q80: Control · parquet=off = 1.00x</title></rect>
    <rect x="336" y="470.5" width="14" height="99.5" rx="2" fill="#55657a" class="bar"><title>Q80: Control · parquet=on = 0.99x</title></rect>
    <rect x="354" y="474.6" width="14" height="95.4" rx="2" fill="#8cc8ff" class="bar"><title>Q80: Dynamic filtering · parquet=off = 0.95x</title></rect>
    <rect x="372" y="475.6" width="14" height="94.4" rx="2" fill="#1771e6" class="bar"><title>Q80: Dynamic filtering · parquet=on = 0.94x</title></rect>
    <text x="352" y="601" class="query">Q80</text>

    <rect x="422" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q39: Control · parquet=off = 1.00x</title></rect>
    <rect x="440" y="472.9" width="14" height="97.1" rx="2" fill="#55657a" class="bar"><title>Q39: Control · parquet=on = 0.97x</title></rect>
    <rect x="458" y="333.2" width="14" height="236.8" rx="2" fill="#8cc8ff" class="bar"><title>Q39: Dynamic filtering · parquet=off = 2.37x</title></rect>
    <rect x="476" y="422.2" width="14" height="147.8" rx="2" fill="#1771e6" class="bar"><title>Q39: Dynamic filtering · parquet=on = 1.48x</title></rect>
    <text x="456" y="601" class="query">Q39</text>

    <rect x="526" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q27: Control · parquet=off = 1.00x</title></rect>
    <rect x="544" y="493.1" width="14" height="76.9" rx="2" fill="#55657a" class="bar"><title>Q27: Control · parquet=on = 0.77x</title></rect>
    <rect x="562" y="473.0" width="14" height="97.0" rx="2" fill="#8cc8ff" class="bar"><title>Q27: Dynamic filtering · parquet=off = 0.97x</title></rect>
    <rect x="580" y="499.9" width="14" height="70.1" rx="2" fill="#1771e6" class="bar"><title>Q27: Dynamic filtering · parquet=on = 0.70x</title></rect>
    <text x="560" y="601" class="query">Q27</text>

    <rect x="630" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q25: Control · parquet=off = 1.00x</title></rect>
    <rect x="648" y="465.6" width="14" height="104.4" rx="2" fill="#55657a" class="bar"><title>Q25: Control · parquet=on = 1.04x</title></rect>
    <rect x="666" y="460.5" width="14" height="109.5" rx="2" fill="#8cc8ff" class="bar"><title>Q25: Dynamic filtering · parquet=off = 1.10x</title></rect>
    <rect x="684" y="477.8" width="14" height="92.2" rx="2" fill="#1771e6" class="bar"><title>Q25: Dynamic filtering · parquet=on = 0.92x</title></rect>
    <text x="664" y="601" class="query">Q25</text>

    <rect x="734" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q82: Control · parquet=off = 1.00x</title></rect>
    <rect x="752" y="506.7" width="14" height="63.3" rx="2" fill="#55657a" class="bar"><title>Q82: Control · parquet=on = 0.63x</title></rect>
    <rect x="770" y="366.3" width="14" height="203.7" rx="2" fill="#8cc8ff" class="bar"><title>Q82: Dynamic filtering · parquet=off = 2.04x</title></rect>
    <rect x="788" y="447.6" width="14" height="122.4" rx="2" fill="#1771e6" class="bar"><title>Q82: Dynamic filtering · parquet=on = 1.22x</title></rect>
    <text x="768" y="601" class="query">Q82</text>

    <rect x="838" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q17: Control · parquet=off = 1.00x</title></rect>
    <rect x="856" y="475.3" width="14" height="94.7" rx="2" fill="#55657a" class="bar"><title>Q17: Control · parquet=on = 0.95x</title></rect>
    <rect x="874" y="482.7" width="14" height="87.3" rx="2" fill="#8cc8ff" class="bar"><title>Q17: Dynamic filtering · parquet=off = 0.87x</title></rect>
    <rect x="892" y="496.3" width="14" height="73.7" rx="2" fill="#1771e6" class="bar"><title>Q17: Dynamic filtering · parquet=on = 0.74x</title></rect>
    <text x="872" y="601" class="query">Q17</text>

    <rect x="942" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q98: Control · parquet=off = 1.00x</title></rect>
    <rect x="960" y="478.0" width="14" height="92.0" rx="2" fill="#55657a" class="bar"><title>Q98: Control · parquet=on = 0.92x</title></rect>
    <rect x="978" y="480.3" width="14" height="89.7" rx="2" fill="#8cc8ff" class="bar"><title>Q98: Dynamic filtering · parquet=off = 0.90x</title></rect>
    <rect x="996" y="520.0" width="14" height="50.0" rx="2" fill="#1771e6" class="bar"><title>Q98: Dynamic filtering · parquet=on = 0.50x</title></rect>
    <text x="976" y="601" class="query">Q98</text>

    <rect x="1046" y="470.0" width="14" height="100.0" rx="2" fill="#a7b0be" class="bar"><title>Q26: Control · parquet=off = 1.00x</title></rect>
    <rect x="1064" y="515.4" width="14" height="54.6" rx="2" fill="#55657a" class="bar"><title>Q26: Control · parquet=on = 0.55x</title></rect>
    <rect x="1082" y="441.9" width="14" height="128.1" rx="2" fill="#8cc8ff" class="bar"><title>Q26: Dynamic filtering · parquet=off = 1.28x</title></rect>
    <rect x="1100" y="513.2" width="14" height="56.8" rx="2" fill="#1771e6" class="bar"><title>Q26: Dynamic filtering · parquet=on = 0.57x</title></rect>
    <text x="1080" y="601" class="query">Q26</text>

    <text x="624" y="640" class="axis-title">TPC-DS query</text>
  </g>
</svg>
