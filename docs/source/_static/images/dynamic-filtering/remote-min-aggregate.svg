<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 750" role="img" aria-labelledby="title desc">
  <title id="title">Incremental remote dynamic filtering for a MIN aggregate</title>
  <desc id="desc">Four scans feed two partial MIN aggregates. A final aggregate combines their partial minima in the next stage. The partial aggregates report independently safe upper bounds, which the coordinator intersects with AND and sends back to the scans.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b949e"/></marker>
    <marker id="filter-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d74633"/></marker>
    <style>
      .scene{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.heading{fill:#24292f;font-size:15px;font-weight:650}.label{fill:#57606a;font-size:12px}.small{fill:#57606a;font-size:10.5px}.stage{fill:#6e7781;font-size:11px;font-weight:700;letter-spacing:.08em}.panel{fill:#fff;stroke:#d8dee4;stroke-width:1.5}.producer{fill:#f6f8fa;stroke:#d8dee4;stroke-width:1.5}.final{fill:#f0f7ff;stroke:#54aeff;stroke-width:1.5}.coord{fill:#fff8f5;stroke:#d74633;stroke-width:1.5}.network{fill:#eef2f6;stroke:#afb8c1;stroke-width:1.2}.data-flow{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#data-arrow)}.filter-up{fill:none;stroke:#d74633;stroke-width:2;marker-end:url(#filter-arrow)}.filter-bus{fill:none;stroke:#d74633;stroke-width:2}.filter-down{fill:none;stroke:#d74633;stroke-width:2;marker-end:url(#filter-arrow)}.row rect{fill:#eef2f6;stroke:#d0d7de}.row text{fill:#24292f;font-size:11px;text-anchor:middle}.keep rect{fill:#dafbe1;stroke:#4ac26b}.packet rect{fill:#fff1e5;stroke:#d74633;stroke-width:1.4}.packet text{fill:#9a2f22;font-size:10px;font-weight:650;text-anchor:middle}.data-chip rect{fill:#eaeef2;stroke:#afb8c1}.data-chip text{fill:#57606a;font-size:9px;text-anchor:middle}
      .data-chip{opacity:0;animation:dataUp 10s ease-in-out infinite}.g1{opacity:0;animation:g1 10s linear infinite}.g2{opacity:0;animation:g2 10s linear infinite}.downlink{opacity:0;animation:downlink 10s linear infinite}.filter-true{animation:filterTrue 10s linear infinite}.filter-early{opacity:0;animation:filterEarly 10s linear infinite}.filter-late{opacity:0;animation:filterLate 10s linear infinite}.drop-early{animation:dropEarly 10s linear infinite}.drop-late{animation:dropLate 10s linear infinite}.strike-early{opacity:0;animation:strikeEarly 10s linear infinite}.strike-late{opacity:0;animation:strikeLate 10s linear infinite}.status-data{opacity:0;animation:statusData 10s linear infinite}.status-early{opacity:0;animation:statusEarly 10s linear infinite}.status-late{opacity:0;animation:statusLate 10s linear infinite}
      @keyframes dataUp{0%,3%{opacity:0;transform:translateY(0)}7%,15%{opacity:1}20%,100%{opacity:0;transform:translateY(-38px)}}@keyframes g1{0%,11%{opacity:0}16%,43%{opacity:1}48%,100%{opacity:0}}@keyframes g2{0%,44%{opacity:0}49%,95%{opacity:1}99%,100%{opacity:0}}@keyframes downlink{0%,24%{opacity:0}30%,95%{opacity:1}99%,100%{opacity:0}}@keyframes filterTrue{0%,34%{opacity:1}40%,100%{opacity:0}}@keyframes filterEarly{0%,34%{opacity:0}40%,69%{opacity:1}75%,100%{opacity:0}}@keyframes filterLate{0%,69%{opacity:0}75%,95%{opacity:1}99%,100%{opacity:0}}@keyframes dropEarly{0%,34%{opacity:1}40%,95%{opacity:.18}99%,100%{opacity:1}}@keyframes dropLate{0%,69%{opacity:1}75%,95%{opacity:.18}99%,100%{opacity:1}}@keyframes strikeEarly{0%,34%{opacity:0}40%,95%{opacity:1}99%,100%{opacity:0}}@keyframes strikeLate{0%,69%{opacity:0}75%,95%{opacity:1}99%,100%{opacity:0}}@keyframes statusData{0%,3%{opacity:0}7%,18%{opacity:1}23%,100%{opacity:0}}@keyframes statusEarly{0%,18%{opacity:0}23%,68%{opacity:1}73%,100%{opacity:0}}@keyframes statusLate{0%,69%{opacity:0}75%,95%{opacity:1}99%,100%{opacity:0}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.data-chip,.g1,.filter-true,.filter-early,.status-data,.status-early{opacity:0}.g2,.downlink,.filter-late,.strike-early,.strike-late,.status-late{opacity:1}.drop-early,.drop-late{opacity:.18}}
    </style>
  </defs>
  <g class="scene">
    <rect width="960" height="750" rx="16" fill="#fbfcfd"/><text x="30" y="33" class="heading">MIN aggregate: partial bounds remain safe globally</text><text x="930" y="33" class="label" text-anchor="end">10-second loop</text>

    <text x="30" y="94" class="stage">COORDINATOR</text><rect x="330" y="52" width="410" height="103" rx="12" class="coord"/><text x="350" y="79" class="heading">Query coordinator</text><text x="350" y="101" class="label">Incremental · AND latest producer bounds</text><g class="g1"><text x="350" y="129" class="small mono">temp &lt; 12 AND temp &lt; 9  ⇒  temp &lt; 9</text></g><g class="g2"><text x="350" y="129" class="small mono">temp &lt; 4 AND temp &lt; 7  ⇒  temp &lt; 4</text></g>

    <text x="30" y="235" class="stage">STAGE 3</text><rect x="330" y="180" width="410" height="105" rx="12" class="final"/><text x="350" y="207" class="heading">Final AggregateExec</text><text x="350" y="229" class="label">MIN(partial minima) produces the global result</text><g class="g1"><text x="350" y="259" class="small mono">MIN(12, 9) = 9</text></g><g class="g2"><text x="350" y="259" class="small mono">MIN(4, 7) = 4</text></g>
    <rect x="210" y="300" width="540" height="32" rx="10" class="network"/><text x="480" y="321" class="small mono" text-anchor="middle">NetworkShuffleExec · partial aggregate states</text><path d="M480 300V285" class="data-flow"/>

    <text x="30" y="410" class="stage">STAGE 2</text><rect x="175" y="350" width="285" height="110" rx="12" class="producer"/><text x="193" y="377" class="heading">Task 0 · Partial AggregateExec</text><text x="193" y="399" class="label">local MIN(temp)</text><g class="g1"><text x="193" y="433" class="small mono">generation 1 · temp &lt; 12</text></g><g class="g2"><text x="193" y="433" class="small mono">generation 2 · temp &lt; 4</text></g>
    <rect x="500" y="350" width="285" height="110" rx="12" class="producer"/><text x="518" y="377" class="heading">Task 1 · Partial AggregateExec</text><text x="518" y="399" class="label">local MIN(temp)</text><g class="g1"><text x="518" y="433" class="small mono">generation 1 · temp &lt; 9</text></g><g class="g2"><text x="518" y="433" class="small mono">generation 2 · temp &lt; 7</text></g>
    <path d="M317 350V332" class="data-flow"/><path d="M642 350V332" class="data-flow"/>
    <path d="M175 395H90V105H330" class="filter-up"/><path d="M785 395H870V105H740" class="filter-up"/>
    <g class="g1 packet" transform="translate(72 246)"><rect width="72" height="24" rx="7"/><text x="36" y="16">&lt; 12 · g1</text></g><g class="g2 packet" transform="translate(72 246)"><rect width="72" height="24" rx="7"/><text x="36" y="16">&lt; 4 · g2</text></g><g class="g1 packet" transform="translate(816 246)"><rect width="72" height="24" rx="7"/><text x="36" y="16">&lt; 9 · g1</text></g><g class="g2 packet" transform="translate(816 246)"><rect width="72" height="24" rx="7"/><text x="36" y="16">&lt; 7 · g2</text></g>

    <rect x="130" y="490" width="700" height="34" rx="10" class="network"/><text x="480" y="512" class="small mono" text-anchor="middle">NetworkShuffleExec · candidate rows</text><path d="M290 490V460" class="data-flow"/><path d="M615 490V460" class="data-flow"/>
    <g class="downlink"><path d="M740 125H925V537H135" class="filter-bus"/><path d="M225 537V555" class="filter-down"/><path d="M430 537V555" class="filter-down"/><path d="M635 537V555" class="filter-down"/><path d="M840 537V555" class="filter-down"/></g>

    <text x="30" y="615" class="stage">STAGE 1</text><path d="M200 555V524" class="data-flow"/><path d="M405 555V524" class="data-flow"/><path d="M610 555V524" class="data-flow"/><path d="M815 555V524" class="data-flow"/>
    <g transform="translate(183 540)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g><g transform="translate(388 540)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g><g transform="translate(593 540)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g><g transform="translate(798 540)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g>
    <rect x="110" y="555" width="180" height="125" rx="12" class="panel"/><text x="126" y="581" class="heading">Scan task 0</text><g transform="translate(126 599)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">temp &lt; 9</text><text class="filter-late small mono">temp &lt; 4</text></g><g class="row keep" transform="translate(126 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">-2</text></g><g class="row drop-late" transform="translate(186 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">5</text></g><g class="strike-late" stroke="#cf222e" stroke-width="2.4"><path d="M195 631h34"/></g>
    <rect x="315" y="555" width="180" height="125" rx="12" class="panel"/><text x="331" y="581" class="heading">Scan task 1</text><g transform="translate(331 599)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">temp &lt; 9</text><text class="filter-late small mono">temp &lt; 4</text></g><g class="row drop-early" transform="translate(331 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">10</text></g><g class="row drop-early" transform="translate(391 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">18</text></g><g class="strike-early" stroke="#cf222e" stroke-width="2.4"><path d="M340 631h34"/><path d="M400 631h34"/></g>
    <rect x="520" y="555" width="180" height="125" rx="12" class="panel"/><text x="536" y="581" class="heading">Scan task 2</text><g transform="translate(536 599)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">temp &lt; 9</text><text class="filter-late small mono">temp &lt; 4</text></g><g class="row keep" transform="translate(536 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">1</text></g><g class="row drop-late" transform="translate(596 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">6</text></g><g class="strike-late" stroke="#cf222e" stroke-width="2.4"><path d="M605 631h34"/></g>
    <rect x="725" y="555" width="180" height="125" rx="12" class="panel"/><text x="741" y="581" class="heading">Scan task 3</text><g transform="translate(741 599)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">temp &lt; 9</text><text class="filter-late small mono">temp &lt; 4</text></g><g class="row drop-late" transform="translate(741 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">8</text></g><g class="row drop-early" transform="translate(801 616)"><rect width="52" height="30" rx="7"/><text x="26" y="20">15</text></g><g class="strike-late" stroke="#cf222e" stroke-width="2.4"><path d="M750 631h34"/></g><g class="strike-early" stroke="#cf222e" stroke-width="2.4"><path d="M810 631h34"/></g>

    <g transform="translate(480 721)" text-anchor="middle"><text class="status-data label">Each partial aggregate emits a local minimum; the final aggregate computes the global minimum.</text><text class="status-early label">The coordinator intersects the current bounds: &lt; 12 AND &lt; 9 becomes &lt; 9.</text><text class="status-late label">Later minima tighten the intersection to &lt; 4 without changing the final result.</text></g>
  </g>
</svg>
