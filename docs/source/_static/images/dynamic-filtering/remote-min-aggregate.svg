<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
  <title id="title">Incremental remote dynamic filtering for a MIN aggregate</title>
  <desc id="desc">Four scan tasks send rows upward through a network stage to two partial MIN aggregate tasks. The aggregates send successively lower bounds up to the coordinator, which merges them and sends each safe generation back down to every scan.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b949e"/></marker><marker id="filter-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#d74633"/></marker>
    <style>
      .scene{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.heading{fill:#24292f;font-size:15px;font-weight:650}.label{fill:#57606a;font-size:12px}.small{fill:#57606a;font-size:10.5px}.stage{fill:#6e7781;font-size:11px;font-weight:700;letter-spacing:.08em}.panel{fill:#fff;stroke:#d8dee4;stroke-width:1.5}.producer{fill:#f6f8fa;stroke:#d8dee4;stroke-width:1.5}.coord{fill:#fff8f5;stroke:#d74633;stroke-width:1.5}.network{fill:#eef2f6;stroke:#afb8c1;stroke-width:1.2}.data-flow{fill:none;stroke:#8b949e;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#data-arrow)}.filter-up{fill:none;stroke:#d74633;stroke-width:2;marker-end:url(#filter-arrow)}.filter-bus{fill:none;stroke:#d74633;stroke-width:2}.filter-down{fill:none;stroke:#d74633;stroke-width:2;marker-end:url(#filter-arrow)}.row rect{fill:#eef2f6;stroke:#d0d7de}.row text{fill:#24292f;font-size:11px;text-anchor:middle}.keep rect{fill:#dafbe1;stroke:#4ac26b}.packet rect{fill:#fff1e5;stroke:#d74633;stroke-width:1.4}.packet text{fill:#9a2f22;font-size:10px;font-weight:650;text-anchor:middle}.data-chip rect{fill:#eaeef2;stroke:#afb8c1}.data-chip text{fill:#57606a;font-size:9px;text-anchor:middle}
      .data-chip{opacity:0;animation:dataUp 12s ease-in-out infinite}.g1{opacity:0;animation:g1 12s linear infinite}.g2{opacity:0;animation:g2 12s linear infinite}.early0{opacity:0;animation:early0 12s ease-in-out infinite}.early1{opacity:0;animation:early1 12s ease-in-out infinite}.late0{opacity:0;animation:late0 12s ease-in-out infinite}.late1{opacity:0;animation:late1 12s ease-in-out infinite}.downlink{opacity:0;animation:downlink 12s linear infinite}.filter-true{animation:filterTrue 12s linear infinite}.filter-early{opacity:0;animation:filterEarly 12s linear infinite}.filter-late{opacity:0;animation:filterLate 12s linear infinite}.drop-early{animation:dropEarly 12s linear infinite}.drop-late{animation:dropLate 12s linear infinite}.strike-early{opacity:0;animation:strikeEarly 12s linear infinite}.strike-late{opacity:0;animation:strikeLate 12s linear infinite}.status-data{opacity:0;animation:statusData 12s linear infinite}.status-early{opacity:0;animation:statusEarly 12s linear infinite}.status-late{opacity:0;animation:statusLate 12s linear infinite}
      @keyframes dataUp{0%,3%{opacity:0;transform:translateY(0)}6%,13%{opacity:1}18%,100%{opacity:0;transform:translateY(-58px)}}@keyframes g1{0%,13%{opacity:0}17%,44%{opacity:1}48%,100%{opacity:0}}@keyframes g2{0%,45%{opacity:0}49%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes early0{0%,15%{opacity:0;transform:translate(0,0)}18%,26%{opacity:1}30%,100%{opacity:0;transform:translate(113px,-57px)}}@keyframes early1{0%,18%{opacity:0;transform:translate(0,0)}21%,29%{opacity:1}33%,100%{opacity:0;transform:translate(-12px,-57px)}}@keyframes late0{0%,48%{opacity:0;transform:translate(0,0)}51%,59%{opacity:1}63%,100%{opacity:0;transform:translate(113px,-57px)}}@keyframes late1{0%,51%{opacity:0;transform:translate(0,0)}54%,62%{opacity:1}66%,100%{opacity:0;transform:translate(-12px,-57px)}}
      @keyframes downlink{0%,29%{opacity:0}34%,94%{opacity:1}99%,100%{opacity:0}}@keyframes filterTrue{0%,40%{opacity:1}45%,100%{opacity:0}}@keyframes filterEarly{0%,40%{opacity:0}45%,73%{opacity:1}78%,100%{opacity:0}}@keyframes filterLate{0%,74%{opacity:0}79%,94%{opacity:1}99%,100%{opacity:0}}@keyframes dropEarly{0%,40%{opacity:1}46%,94%{opacity:.18}99%,100%{opacity:1}}@keyframes dropLate{0%,74%{opacity:1}80%,94%{opacity:.18}99%,100%{opacity:1}}@keyframes strikeEarly{0%,40%{opacity:0}46%,94%{opacity:1}99%,100%{opacity:0}}@keyframes strikeLate{0%,74%{opacity:0}80%,94%{opacity:1}99%,100%{opacity:0}}
      @keyframes statusData{0%,2%{opacity:0}6%,17%{opacity:1}21%,100%{opacity:0}}@keyframes statusEarly{0%,18%{opacity:0}23%,72%{opacity:1}77%,100%{opacity:0}}@keyframes statusLate{0%,75%{opacity:0}80%,94%{opacity:1}99%,100%{opacity:0}}
      @media(prefers-reduced-motion:reduce){*{animation:none!important}.data-chip,.g1,.early0,.early1,.late0,.late1,.filter-true,.filter-early,.status-data,.status-early{opacity:0}.g2,.downlink,.filter-late,.strike-early,.strike-late,.status-late{opacity:1}.drop-early,.drop-late{opacity:.18}}
    </style>
  </defs>
  <g class="scene">
    <rect width="960" height="620" rx="16" fill="#fbfcfd"/><text x="30" y="33" class="heading">MIN aggregate: bounds travel against the row flow</text><text x="930" y="33" class="label" text-anchor="end">12-second loop</text>
    <text x="30" y="94" class="stage">COORDINATOR</text><rect x="330" y="52" width="410" height="103" rx="12" class="coord"/><text x="350" y="79" class="heading">Query coordinator</text><text x="350" y="101" class="label">Incremental · merge latest producer snapshots</text><g class="g1"><text x="350" y="129" class="small mono">temp &lt; 12 OR temp &lt; 9  ⇒  temp &lt; 12</text></g><g class="g2"><text x="350" y="129" class="small mono">temp &lt; 4 OR temp &lt; 7  ⇒  temp &lt; 7</text></g>
    <text x="30" y="245" class="stage">STAGE 2 · MIN</text>
    <rect x="175" y="190" width="285" height="125" rx="12" class="producer"/><text x="193" y="217" class="heading">Task 0 · AggregateExec</text><text x="193" y="239" class="label">partial MIN(temp)</text><g class="g1"><text x="193" y="276" class="small mono">generation 1 · min 12 → temp &lt; 12</text></g><g class="g2"><text x="193" y="276" class="small mono">generation 2 · min 4 → temp &lt; 4</text></g>
    <rect x="500" y="190" width="285" height="125" rx="12" class="producer"/><text x="518" y="217" class="heading">Task 1 · AggregateExec</text><text x="518" y="239" class="label">partial MIN(temp)</text><g class="g1"><text x="518" y="276" class="small mono">generation 1 · min 9 → temp &lt; 9</text></g><g class="g2"><text x="518" y="276" class="small mono">generation 2 · min 7 → temp &lt; 7</text></g>
    <path d="M310 190L430 155" class="filter-up"/><path d="M650 190L640 155" class="filter-up"/><g transform="translate(276 177)"><g class="packet early0"><rect width="68" height="24" rx="7"/><text x="34" y="16">&lt; 12 · g1</text></g></g><g transform="translate(616 177)"><g class="packet early1"><rect width="68" height="24" rx="7"/><text x="34" y="16">&lt; 9 · g1</text></g></g><g transform="translate(276 177)"><g class="packet late0"><rect width="68" height="24" rx="7"/><text x="34" y="16">&lt; 4 · g2</text></g></g><g transform="translate(616 177)"><g class="packet late1"><rect width="68" height="24" rx="7"/><text x="34" y="16">&lt; 7 · g2</text></g></g>
    <rect x="130" y="350" width="700" height="34" rx="10" class="network"/><text x="480" y="372" class="small mono" text-anchor="middle">NetworkShuffleExec · candidate rows flow upward</text><path d="M290 350V315" class="data-flow"/><path d="M615 350V315" class="data-flow"/>
    <g class="downlink"><path d="M740 103H925V397H135" class="filter-bus"/><path d="M225 397V415" class="filter-down"/><path d="M430 397V415" class="filter-down"/><path d="M635 397V415" class="filter-down"/><path d="M840 397V415" class="filter-down"/></g>
    <text x="30" y="475" class="stage">STAGE 1</text><path d="M175 415V384" class="data-flow"/><path d="M380 415V384" class="data-flow"/><path d="M585 415V384" class="data-flow"/><path d="M790 415V384" class="data-flow"/>
    <g transform="translate(158 405)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g><g transform="translate(363 405)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g><g transform="translate(568 405)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g><g transform="translate(773 405)"><g class="data-chip"><rect width="34" height="20" rx="5"/><text x="17" y="14">rows</text></g></g>
    <rect x="110" y="415" width="180" height="125" rx="12" class="panel"/><text x="126" y="441" class="heading">Scan task 0</text><g transform="translate(126 459)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">temp &lt; 12</text><text class="filter-late small mono">temp &lt; 7</text></g><g class="row keep" transform="translate(126 476)"><rect width="52" height="30" rx="7"/><text x="26" y="20">-2</text></g><g class="row keep" transform="translate(186 476)"><rect width="52" height="30" rx="7"/><text x="26" y="20">5</text></g>
    <rect x="315" y="415" width="180" height="125" rx="12" class="panel"/><text x="331" y="441" class="heading">Scan task 1</text><g transform="translate(331 459)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">temp &lt; 12</text><text class="filter-late small mono">temp &lt; 7</text></g><g class="row drop-late" transform="translate(331 476)"><rect width="52" height="30" rx="7"/><text x="26" y="20">10</text></g><g class="row drop-early" transform="translate(391 476)"><rect width="52" height="30" rx="7"/><text x="26" y="20">18</text></g><g class="strike-late" stroke="#cf222e" stroke-width="2.4"><path d="M340 491h34"/></g><g class="strike-early" stroke="#cf222e" stroke-width="2.4"><path d="M400 491h34"/></g>
    <rect x="520" y="415" width="180" height="125" rx="12" class="panel"/><text x="536" y="441" class="heading">Scan task 2</text><g transform="translate(536 459)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">temp &lt; 12</text><text class="filter-late small mono">temp &lt; 7</text></g><g class="row keep" transform="translate(536 476)"><rect width="52" height="30" rx="7"/><text x="26" y="20">1</text></g><g class="row keep" transform="translate(596 476)"><rect width="52" height="30" rx="7"/><text x="26" y="20">6</text></g>
    <rect x="725" y="415" width="180" height="125" rx="12" class="panel"/><text x="741" y="441" class="heading">Scan task 3</text><g transform="translate(741 459)"><text class="filter-true small mono">filter = true</text><text class="filter-early small mono">temp &lt; 12</text><text class="filter-late small mono">temp &lt; 7</text></g><g class="row drop-late" transform="translate(741 476)"><rect width="52" height="30" rx="7"/><text x="26" y="20">8</text></g><g class="row drop-early" transform="translate(801 476)"><rect width="52" height="30" rx="7"/><text x="26" y="20">15</text></g><g class="strike-late" stroke="#cf222e" stroke-width="2.4"><path d="M750 491h34"/></g><g class="strike-early" stroke="#cf222e" stroke-width="2.4"><path d="M810 491h34"/></g>
    <g transform="translate(480 586)" text-anchor="middle"><text class="status-data label">Candidate rows flow upward from four scan tasks to two partial aggregates.</text><text class="status-early label">Each observed minimum travels up, merges, and immediately fans down.</text><text class="status-late label">Later generations lower the bound and prune more rows at every scan.</text></g>
    <g transform="translate(65 352)"><path d="M0 18V0" class="data-flow"/><text x="-8" y="31" class="small">data up</text></g><g transform="translate(884 329)"><path d="M0 0V18" class="filter-down"/><text x="-21" y="35" class="small">filter down</text></g>
  </g>
</svg>
