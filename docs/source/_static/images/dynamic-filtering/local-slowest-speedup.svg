      <rect x="18" y="164.3" width="14" height="405.7" rx="2" fill="#55657a" class="bar"><title>Q69: Control · parquet=on = 1.08x</title></rect>
      <rect x="36" y="201.8" width="14" height="368.2" rx="2" fill="#8cc8ff" class="bar"><title>Q69: Dynamic filtering · parquet=off = 0.98x</title></rect>
      <rect x="54" y="271.9" width="14" height="298.1" rx="2" fill="#1771e6" class="bar"><title>Q69: Dynamic filtering · parquet=on = 0.80x</title></rect>
      <text x="34" y="601" class="query">Q69</text>
    </g>
    <g transform="translate(838 0)">
      <rect y="195.0" width="14" height="375.0" rx="2" fill="#a7b0be" class="bar"><title>Q59: Control · parquet=off = 1.00x</title></rect>
      <rect x="18" y="176.9" width="14" height="393.1" rx="2" fill="#55657a" class="bar"><title>Q59: Control · parquet=on = 1.05x</title></rect>
      <rect x="36" y="217.0" width="14" height="353.0" rx="2" fill="#8cc8ff" class="bar"><title>Q59: Dynamic filtering · parquet=off = 0.94x</title></rect>
      <rect x="54" y="278.9" width="14" height="291.1" rx="2" fill="#1771e6" class="bar"><title>Q59: Dynamic filtering · parquet=on = 0.78x</title></rect>
      <text x="34" y="601" class="query">Q59</text>
