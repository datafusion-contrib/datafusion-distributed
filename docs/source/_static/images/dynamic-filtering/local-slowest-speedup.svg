      <rect x="18" y="251.4" width="14" height="318.6" rx="2" fill="#55657a" class="bar"><title>Q34: Control · parquet=on = 0.85x</title></rect>
      <rect x="36" y="265.8" width="14" height="304.2" rx="2" fill="#8cc8ff" class="bar"><title>Q34: Dynamic filtering · parquet=off = 0.81x</title></rect>
