      <rect x="18" y="187.5" width="14" height="382.5" rx="2" fill="#55657a" class="bar"><title>Q65: Control · parquet=on = 1.02x</title></rect>
      <rect x="36" y="202.5" width="14" height="367.5" rx="2" fill="#8cc8ff" class="bar"><title>Q65: Dynamic filtering · parquet=off = 0.98x</title></rect>
      <rect x="54" y="314.0" width="14" height="256.0" rx="2" fill="#1771e6" class="bar"><title>Q65: Dynamic filtering · parquet=on = 0.68x</title></rect>
      <text x="34" y="601" class="query">Q65</text>
    </g>
    <g transform="translate(526 0)">
      <rect y="195.0" width="14" height="375.0" rx="2" fill="#a7b0be" class="bar"><title>Q83: Control · parquet=off = 1.00x</title></rect>
      <rect x="18" y="137.6" width="14" height="432.4" rx="2" fill="#55657a" class="bar"><title>Q83: Control · parquet=on = 1.15x</title></rect>
      <rect x="36" y="229.6" width="14" height="340.4" rx="2" fill="#8cc8ff" class="bar"><title>Q83: Dynamic filtering · parquet=off = 0.91x</title></rect>
