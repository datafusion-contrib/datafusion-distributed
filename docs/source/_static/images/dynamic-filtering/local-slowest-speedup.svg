<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Largest local TPC-DS benchmark regressions with dynamic filtering</title>
  <desc id="desc">Grouped bar chart for the ten largest local TPC-DS slowdowns using dynamic-filter configuration A. Each query has four bars: control with parquet=off, control with parquet=on, dynamic filtering with parquet=off, and dynamic filtering with parquet=on. Lower bars indicate slower execution.</desc>
  <style>
    .chart{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .axis{stroke:#667085;stroke-width:1.5}.grid{stroke:#d8dee7;stroke-width:1}.baseline{stroke:#8895a7;stroke-width:1.5;stroke-dasharray:6 5}
    .tick{fill:#57606a;font-size:14px}.query{fill:#24292f;font-size:15px;font-weight:650;text-anchor:middle}
    .axis-title{fill:#344054;font-size:15px;font-weight:650;text-anchor:middle}.legend{fill:#344054;font-size:14px}.bar{stroke:#fff;stroke-width:1}
  </style>
  <g class="chart">
    <rect width="1200" height="680" rx="16" fill="#fbfcfd"/>
    <rect x="90" y="42" width="18" height="18" rx="3" fill="#a7b0be"/><text x="117" y="56" class="legend">Control · parquet=off</text>
    <rect x="365" y="42" width="18" height="18" rx="3" fill="#55657a"/><text x="392" y="56" class="legend">Control · parquet=on</text>
    <rect x="640" y="42" width="18" height="18" rx="3" fill="#8cc8ff"/><text x="667" y="56" class="legend">Dynamic filtering · parquet=off</text>
    <rect x="915" y="42" width="18" height="18" rx="3" fill="#1771e6"/><text x="942" y="56" class="legend">Dynamic filtering · parquet=on</text>

    <line x1="88" y1="570" x2="1160" y2="570" class="grid"/><text x="74" y="575" class="tick" text-anchor="end">0x</text>
    <line x1="88" y1="476.3" x2="1160" y2="476.3" class="grid"/><text x="74" y="481.3" class="tick" text-anchor="end">0.25x</text>
    <line x1="88" y1="382.5" x2="1160" y2="382.5" class="grid"/><text x="74" y="387.5" class="tick" text-anchor="end">0.5x</text>
    <line x1="88" y1="288.8" x2="1160" y2="288.8" class="grid"/><text x="74" y="293.8" class="tick" text-anchor="end">0.75x</text>
    <line x1="88" y1="195" x2="1160" y2="195" class="baseline"/><text x="74" y="200" class="tick" text-anchor="end">1x</text>
    <line x1="88" y1="120" x2="1160" y2="120" class="grid"/><text x="74" y="125" class="tick" text-anchor="end">1.2x</text>
    <line x1="88" y1="120" x2="88" y2="570" class="axis"/><line x1="88" y1="570" x2="1160" y2="570" class="axis"/>
    <text x="25" y="345" class="axis-title" transform="rotate(-90 25 345)">Speedup</text>

    <g transform="translate(110 0)">
      <rect y="195.0" width="14" height="375.0" rx="2" fill="#a7b0be" class="bar"><title>Q50: Control · parquet=off = 1.00x</title></rect>
      <rect x="18" y="207.2" width="14" height="362.8" rx="2" fill="#55657a" class="bar"><title>Q50: Control · parquet=on = 0.97x</title></rect>
      <rect x="36" y="221.5" width="14" height="348.5" rx="2" fill="#8cc8ff" class="bar"><title>Q50: Dynamic filtering · parquet=off = 0.93x</title></rect>
      <rect x="54" y="375.0" width="14" height="195.0" rx="2" fill="#1771e6" class="bar"><title>Q50: Dynamic filtering · parquet=on = 0.52x</title></rect>
      <text x="34" y="601" class="query">Q50</text>
    </g>
    <g transform="translate(214 0)">
      <rect y="195.0" width="14" height="375.0" rx="2" fill="#a7b0be" class="bar"><title>Q54: Control · parquet=off = 1.00x</title></rect>
