<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title desc">
  <title id="title">Why Q80 improves in the local benchmark but regresses in the distributed benchmark</title>
  <desc id="desc">A two-by-two animated comparison shows dynamic filtering off and on in the local and distributed benchmarks. Progressive reads are cheap against warm local storage. Against S3, every dependent read adds I/O latency, and sparse shuffle output remains buffered until end-of-stream.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8b949e"/></marker>
    <style>
      .scene{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.panel{fill:#fff;stroke:#d8dee4;stroke-width:1.5}.active{fill:none;stroke:#218bff;stroke-width:2.5;opacity:0}.heading{fill:#24292f;font-size:12px;font-weight:700}.stage{fill:#57606a;font-size:10.5px;font-weight:700;letter-spacing:.055em}.label{fill:#57606a;font-size:10.5px}.small{fill:#57606a;font-size:9px}.note{fill:#6e7781;font-size:9.5px}.box{fill:#f6f8fa;stroke:#afb8c1;stroke-width:1.2}.read{fill:#eef2f6;stroke:#afb8c1;stroke-width:1.1}.read-active{fill:#ddf4ff;stroke:#218bff;stroke-width:1.5;opacity:0}.filter{fill:#fff1e5;stroke:#d74633;stroke-width:1.1}.filter-active{fill:#ffd8cc;stroke:#d74633;stroke-width:1.5;opacity:0}.good{fill:#dafbe1;stroke:#2da44e;stroke-width:1.3}.flow{fill:none;stroke:#8b949e;stroke-width:1.5;marker-end:url(#arrow)}.batch rect{fill:#ddf4ff;stroke:#218bff;stroke-width:1}.batch text{fill:#0969da;font-size:8.5px;font-weight:650;text-anchor:middle}.sparse{fill:#d74633}.badge{fill:#6f42c1}.badge-text{fill:#fff;font-size:10px;font-weight:700;text-anchor:middle}.progress-track{fill:#dbeafe}.progress-fill{fill:#218bff;transform-box:fill-box;transform-origin:left center;animation:progress 12s linear infinite}
      .p1{animation:p1 12s linear infinite}.p2{animation:p2 12s linear infinite}.p3{animation:p3 12s linear infinite}.p4{animation:p4 12s linear infinite}.fill1{fill:#54aeff;opacity:.35;transform-box:fill-box;transform-origin:left center;animation:fill1 12s ease-in-out infinite}.fill3{fill:#54aeff;opacity:.35;transform-box:fill-box;transform-origin:left center;animation:fill3 12s ease-in-out infinite}.b1{opacity:0;animation:b1 12s ease-in-out infinite}.b2{opacity:0;animation:b2 12s ease-in-out infinite}.b3{opacity:0;animation:b3 12s ease-in-out infinite}.b4{opacity:0;animation:b4 12s ease-in-out infinite}.local-result{opacity:0;animation:localResult 12s linear infinite}.remote-result{opacity:0;animation:remoteResult 12s linear infinite}
      .lr1{animation:lr1 12s linear infinite}.lf1{animation:lf1 12s linear infinite}.lr2{animation:lr2 12s linear infinite}.lf2{animation:lf2 12s linear infinite}.lr3{animation:lr3 12s linear infinite}.lf3{animation:lf3 12s linear infinite}.lr4{animation:lr4 12s linear infinite}.lf4{animation:lf4 12s linear infinite}.lr5{animation:lr5 12s linear infinite}.rr1{animation:rr1 12s linear infinite}.rf1{animation:rf1 12s linear infinite}.rr2{animation:rr2 12s linear infinite}.rf2{animation:rf2 12s linear infinite}.rr3{animation:rr3 12s linear infinite}.rf3{animation:rf3 12s linear infinite}.rr4{animation:rr4 12s linear infinite}.rf4{animation:rf4 12s linear infinite}.rr5{animation:rr5 12s linear infinite}
      @keyframes p1{0%,2%{opacity:0}4%,23%{opacity:1}25%,100%{opacity:0}}@keyframes p2{0%,24%{opacity:0}26%,48%{opacity:1}50%,100%{opacity:0}}@keyframes p3{0%,49%{opacity:0}51%,73%{opacity:1}75%,100%{opacity:0}}@keyframes p4{0%,74%{opacity:0}76%,98%{opacity:1}100%{opacity:0}}
      @keyframes fill1{0%,3%{transform:scaleX(0)}12%,23%{transform:scaleX(1)}25%,100%{transform:scaleX(0)}}@keyframes b1{0%,11%{opacity:0}14%,21%{opacity:1}24%,100%{opacity:0}}
      @keyframes lr1{0%,25%{opacity:0}27%,29%{opacity:1}31%,100%{opacity:0}}@keyframes lf1{0%,28%{opacity:0}29%,30%{opacity:1}32%,100%{opacity:0}}@keyframes lr2{0%,29%{opacity:0}31%,33%{opacity:1}35%,100%{opacity:0}}@keyframes lf2{0%,32%{opacity:0}33%,34%{opacity:1}36%,100%{opacity:0}}@keyframes lr3{0%,33%{opacity:0}35%,37%{opacity:1}39%,100%{opacity:0}}@keyframes lf3{0%,36%{opacity:0}37%,38%{opacity:1}40%,100%{opacity:0}}@keyframes lr4{0%,37%{opacity:0}39%,41%{opacity:1}43%,100%{opacity:0}}@keyframes lf4{0%,40%{opacity:0}41%,42%{opacity:1}44%,100%{opacity:0}}@keyframes lr5{0%,41%{opacity:0}43%,45%{opacity:1}48%,100%{opacity:0}}@keyframes localResult{0%,44%{opacity:0}46%,49%{opacity:1}51%,100%{opacity:0}}@keyframes b2{0%,45%{opacity:0}47%,49%{opacity:1}51%,100%{opacity:0}}
      @keyframes fill3{0%,50%{transform:scaleX(0)}59%,72%{transform:scaleX(1)}75%,100%{transform:scaleX(0)}}@keyframes b3{0%,58%{opacity:0}61%,70%{opacity:1}74%,100%{opacity:0}}
      @keyframes rr1{0%,75%{opacity:0}77%,79%{opacity:1}81%,100%{opacity:0}}@keyframes rf1{0%,78%{opacity:0}79%,80%{opacity:1}82%,100%{opacity:0}}@keyframes rr2{0%,79%{opacity:0}81%,83%{opacity:1}85%,100%{opacity:0}}@keyframes rf2{0%,82%{opacity:0}83%,84%{opacity:1}86%,100%{opacity:0}}@keyframes rr3{0%,83%{opacity:0}85%,87%{opacity:1}89%,100%{opacity:0}}@keyframes rf3{0%,86%{opacity:0}87%,88%{opacity:1}90%,100%{opacity:0}}@keyframes rr4{0%,87%{opacity:0}89%,91%{opacity:1}93%,100%{opacity:0}}@keyframes rf4{0%,90%{opacity:0}91%,92%{opacity:1}94%,100%{opacity:0}}@keyframes rr5{0%,91%{opacity:0}93%,95%{opacity:1}98%,100%{opacity:0}}@keyframes remoteResult{0%,94%{opacity:0}96%,99%{opacity:1}100%{opacity:0}}@keyframes b4{0%,95%{opacity:0}97%,99%{opacity:1}100%{opacity:0}}
      @keyframes progress{from{transform:scaleX(0)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}.active,.read-active,.filter-active,.batch{opacity:0}.fill1,.fill3{transform:scaleX(1)}.local-result,.remote-result{opacity:1}}
    </style>
  </defs>
  <g class="scene">
    <rect width="960" height="660" rx="16" fill="#fbfcfd"/><g aria-label="Animation progress"><rect x="780" y="18" width="150" height="4" rx="2" class="progress-track"/><rect x="780" y="18" width="150" height="4" rx="2" class="progress-fill"/></g>

    <rect x="25" y="38" width="445" height="268" rx="14" class="panel"/><rect x="25" y="38" width="445" height="268" rx="14" class="active p1"/>
    <circle cx="49" cy="63" r="12" class="badge"/><text x="49" y="67" class="badge-text">1</text><text x="69" y="67" class="stage">LOCAL BENCHMARK · FILTERS OFF</text>
    <text x="48" y="111" class="label">Storage</text><rect x="104" y="85" width="230" height="44" rx="8" class="read"/><rect x="111" y="92" width="216" height="30" rx="5" class="fill1"/><text x="219" y="111" class="heading" text-anchor="middle">one combined local read</text><path d="M334 107H358" class="flow"/><rect x="368" y="87" width="78" height="40" rx="8" class="good"/><text x="407" y="111" class="heading" text-anchor="middle">batch</text>
    <text x="48" y="197" class="label">Result</text><rect x="104" y="172" width="115" height="43" rx="8" class="box"/><text x="161" y="198" class="heading" text-anchor="middle">full rows</text><path d="M219 193H322" class="flow"/><rect x="332" y="172" width="114" height="43" rx="8" class="box"/><text x="389" y="190" class="heading" text-anchor="middle">full downstream</text><text x="389" y="205" class="small" text-anchor="middle">work · 1.00x</text><text x="247" y="272" class="note" text-anchor="middle">baseline: one read, then normal join and shuffle work</text>

    <rect x="490" y="38" width="445" height="268" rx="14" class="panel"/><rect x="490" y="38" width="445" height="268" rx="14" class="active p2"/>
    <circle cx="514" cy="63" r="12" class="badge"/><text x="514" y="67" class="badge-text">2</text><text x="534" y="67" class="stage">LOCAL BENCHMARK · REMOTE FILTERS ON</text>
    <g><rect x="515" y="88" width="48" height="40" rx="7" class="read"/><rect x="515" y="88" width="48" height="40" rx="7" class="read-active lr1"/><text x="539" y="112" class="small mono" text-anchor="middle">read 1</text></g><path d="M563 108H572" class="flow"/><circle cx="580" cy="108" r="8" class="filter"/><circle cx="580" cy="108" r="8" class="filter-active lf1"/>
    <g><rect x="594" y="88" width="48" height="40" rx="7" class="read"/><rect x="594" y="88" width="48" height="40" rx="7" class="read-active lr2"/><text x="618" y="112" class="small mono" text-anchor="middle">read 2</text></g><path d="M642 108H646" class="flow"/><circle cx="654" cy="108" r="8" class="filter"/><circle cx="654" cy="108" r="8" class="filter-active lf2"/>
    <g><rect x="668" y="88" width="48" height="40" rx="7" class="read"/><rect x="668" y="88" width="48" height="40" rx="7" class="read-active lr3"/><text x="692" y="112" class="small mono" text-anchor="middle">read 3</text></g><path d="M716 108H720" class="flow"/><circle cx="728" cy="108" r="8" class="filter"/><circle cx="728" cy="108" r="8" class="filter-active lf3"/>
    <g><rect x="742" y="88" width="48" height="40" rx="7" class="read"/><rect x="742" y="88" width="48" height="40" rx="7" class="read-active lr4"/><text x="766" y="112" class="small mono" text-anchor="middle">read 4</text></g><path d="M790 108H794" class="flow"/><circle cx="802" cy="108" r="8" class="filter"/><circle cx="802" cy="108" r="8" class="filter-active lf4"/>
    <g><rect x="816" y="88" width="48" height="40" rx="7" class="read"/><rect x="816" y="88" width="48" height="40" rx="7" class="read-active lr5"/><text x="840" y="112" class="small mono" text-anchor="middle">read 5</text></g><text x="712" y="145" class="note" text-anchor="middle">progressive reads against warm local storage</text>
    <g class="local-result"><text x="513" y="197" class="label">Result</text><rect x="565" y="172" width="115" height="43" rx="8" class="box"/><text x="622" y="190" class="heading" text-anchor="middle">fewer rows</text><text x="622" y="205" class="small" text-anchor="middle">cheap reads</text><path d="M680 193H782" class="flow"/><rect x="792" y="172" width="119" height="43" rx="8" class="good"/><text x="851" y="190" class="heading" text-anchor="middle">less work</text><text x="851" y="205" class="small" text-anchor="middle">2.72x faster</text></g><text x="712" y="272" class="note" text-anchor="middle">extra read phases are cheap; downstream savings dominate</text>

    <rect x="25" y="326" width="445" height="304" rx="14" class="panel"/><rect x="25" y="326" width="445" height="304" rx="14" class="active p3"/>
    <circle cx="49" cy="351" r="12" class="badge"/><text x="49" y="355" class="badge-text">3</text><text x="69" y="355" class="stage">DISTRIBUTED BENCHMARK · FILTERS OFF</text>
    <text x="48" y="405" class="label">S3</text><rect x="104" y="379" width="230" height="44" rx="8" class="read"/><rect x="111" y="386" width="216" height="30" rx="5" class="fill3"/><text x="219" y="405" class="heading" text-anchor="middle">one combined S3 range read</text><path d="M334 401H358" class="flow"/><rect x="368" y="381" width="78" height="40" rx="8" class="good"/><text x="407" y="405" class="heading" text-anchor="middle">batch</text>
    <text x="48" y="496" class="label">Shuffle</text><path d="M104 492H353" class="flow"/><rect x="363" y="471" width="83" height="43" rx="8" class="good"/><text x="404" y="497" class="heading" text-anchor="middle">join</text><text x="247" y="548" class="note" text-anchor="middle">full batches stream while the scan is running</text><text x="247" y="599" class="heading" text-anchor="middle">baseline · 1.00x</text>

    <rect x="490" y="326" width="445" height="304" rx="14" class="panel"/><rect x="490" y="326" width="445" height="304" rx="14" class="active p4"/>
    <circle cx="514" cy="351" r="12" class="badge"/><text x="514" y="355" class="badge-text">4</text><text x="534" y="355" class="stage">DISTRIBUTED BENCHMARK · REMOTE FILTERS ON</text>
    <g><rect x="515" y="379" width="48" height="40" rx="7" class="read"/><rect x="515" y="379" width="48" height="40" rx="7" class="read-active rr1"/><text x="539" y="403" class="small mono" text-anchor="middle">read 1</text></g><path d="M563 399H572" class="flow"/><circle cx="580" cy="399" r="8" class="filter"/><circle cx="580" cy="399" r="8" class="filter-active rf1"/>
    <g><rect x="594" y="379" width="48" height="40" rx="7" class="read"/><rect x="594" y="379" width="48" height="40" rx="7" class="read-active rr2"/><text x="618" y="403" class="small mono" text-anchor="middle">read 2</text></g><path d="M642 399H646" class="flow"/><circle cx="654" cy="399" r="8" class="filter"/><circle cx="654" cy="399" r="8" class="filter-active rf2"/>
    <g><rect x="668" y="379" width="48" height="40" rx="7" class="read"/><rect x="668" y="379" width="48" height="40" rx="7" class="read-active rr3"/><text x="692" y="403" class="small mono" text-anchor="middle">read 3</text></g><path d="M716 399H720" class="flow"/><circle cx="728" cy="399" r="8" class="filter"/><circle cx="728" cy="399" r="8" class="filter-active rf3"/>
    <g><rect x="742" y="379" width="48" height="40" rx="7" class="read"/><rect x="742" y="379" width="48" height="40" rx="7" class="read-active rr4"/><text x="766" y="403" class="small mono" text-anchor="middle">read 4</text></g><path d="M790 399H794" class="flow"/><circle cx="802" cy="399" r="8" class="filter"/><circle cx="802" cy="399" r="8" class="filter-active rf4"/>
    <g><rect x="816" y="379" width="48" height="40" rx="7" class="read"/><rect x="816" y="379" width="48" height="40" rx="7" class="read-active rr5"/><text x="840" y="403" class="small mono" text-anchor="middle">read 5</text></g><text x="712" y="440" class="note" text-anchor="middle">same bytes · every dependent read pays S3 I/O overhead</text>
    <g class="remote-result"><text x="513" y="496" class="label">Shuffle</text><rect x="565" y="471" width="102" height="43" rx="8" class="box"/><text x="616" y="490" class="heading" text-anchor="middle">sparse rows</text><text x="616" y="505" class="small" text-anchor="middle">buffered</text><path d="M667 492H721" class="flow"/><text x="695" y="478" class="small" text-anchor="middle">EOF</text><rect x="731" y="471" width="78" height="43" rx="8" class="box"/><text x="770" y="497" class="heading" text-anchor="middle">flush</text><path d="M809 492H833" class="flow"/><rect x="843" y="471" width="68" height="43" rx="8" class="good"/><text x="877" y="497" class="heading" text-anchor="middle">join</text><text x="711" y="548" class="note" text-anchor="middle">fewer rows move, but downstream work waits for end-of-stream</text><text x="711" y="599" class="heading" text-anchor="middle">slower critical path · 0.855x</text></g>
  </g>
