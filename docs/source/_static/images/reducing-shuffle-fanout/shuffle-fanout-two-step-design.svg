      <path d="M24 72L18 54M47.5 72V54M71 72L79 54" class="local-fan"/>
      <rect x="5" y="72" width="85" height="30" rx="5" class="local-repartition"/>
      <text x="47.5" y="84" class="tiny mono" text-anchor="middle">local</text>
      <text x="47.5" y="96" class="tiny mono" text-anchor="middle">RepartitionExec</text>
      <path d="M47.5 128V106" class="consumer-input"/>
    </g>
    <g transform="translate(765 80)">
      <rect width="95" height="130" rx="7" class="consumer"/>
      <text x="47.5" y="25" class="heading" text-anchor="middle">C7</text>
      <rect x="8" y="34" width="79" height="14" class="partition-strip"/>
      <path d="M24 72L18 54M47.5 72V54M71 72L79 54" class="local-fan"/>
      <rect x="5" y="72" width="85" height="30" rx="5" class="local-repartition"/>
      <text x="47.5" y="84" class="tiny mono" text-anchor="middle">local</text>
      <text x="47.5" y="96" class="tiny mono" text-anchor="middle">RepartitionExec</text>
      <path d="M47.5 128V106" class="consumer-input"/>
    </g>

    <rect x="30" y="396" width="370" height="30" rx="5" class="stage-label-bg"/>
    <text x="30" y="418" class="heading">Stage 0 · 4 producing tasks</text>

    <g transform="translate(30 438)">
      <rect width="195" height="90" rx="7" class="producer"/>
      <text x="16" y="27" class="heading">P0</text>
      <rect x="16" y="38" width="163" height="38" rx="5" class="producer-repartition"/>
      <text x="97.5" y="55" class="small mono" text-anchor="middle">RepartitionExec</text>
      <text x="97.5" y="70" class="small mono" text-anchor="middle">16 → 8 task buckets</text>
    </g>
    <g transform="translate(245 438)">
      <rect width="195" height="90" rx="7" class="producer"/>
      <text x="16" y="27" class="heading">P1</text>
      <rect x="16" y="38" width="163" height="38" rx="5" class="producer-repartition"/>
      <text x="97.5" y="55" class="small mono" text-anchor="middle">RepartitionExec</text>
      <text x="97.5" y="70" class="small mono" text-anchor="middle">16 → 8 task buckets</text>
    </g>
    <g transform="translate(460 438)">
      <rect width="195" height="90" rx="7" class="producer"/>
      <text x="16" y="27" class="heading">P2</text>
      <rect x="16" y="38" width="163" height="38" rx="5" class="producer-repartition"/>
      <text x="97.5" y="55" class="small mono" text-anchor="middle">RepartitionExec</text>
      <text x="97.5" y="70" class="small mono" text-anchor="middle">16 → 8 task buckets</text>
    </g>
    <g transform="translate(675 438)">
      <rect width="195" height="90" rx="7" class="producer"/>
      <text x="16" y="27" class="heading">P3</text>
      <rect x="16" y="38" width="163" height="38" rx="5" class="producer-repartition"/>
      <text x="97.5" y="55" class="small mono" text-anchor="middle">RepartitionExec</text>
      <text x="97.5" y="70" class="small mono" text-anchor="middle">16 → 8 task buckets</text>
    </g>

    <text x="450" y="556" class="label" text-anchor="middle">Remote fanout per producer: 8 task buckets instead of 128 partitions</text>
  </g>
</svg>
