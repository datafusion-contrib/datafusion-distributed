    <path d="M310 438L287.5 210" class="network-path"/>
    <path d="M331.5 438L392.5 210" class="network-path"/>
    <path d="M353 438L497.5 210" class="network-path"/>
    <path d="M374.5 438L602.5 210" class="network-path"/>
    <path d="M396 438L707.5 210" class="network-path"/>
    <path d="M417.5 438L812.5 210" class="network-path"/>
    <path d="M482 438L77.5 210" class="network-path"/>
    <path d="M503.5 438L182.5 210" class="network-path"/>
    <path d="M525 438L287.5 210" class="network-path"/>
    <path d="M546.5 438L392.5 210" class="network-path"/>
    <path d="M568 438L497.5 210" class="network-path"/>
    <path d="M589.5 438L602.5 210" class="network-path"/>
    <path d="M611 438L707.5 210" class="network-path"/>
    <path d="M632.5 438L812.5 210" class="network-path"/>
    <path d="M697 438L77.5 210" class="network-path"/>
    <path d="M718.5 438L182.5 210" class="network-path"/>
    <path d="M740 438L287.5 210" class="network-path"/>
    <path d="M761.5 438L392.5 210" class="network-path"/>
    <path d="M783 438L497.5 210" class="network-path"/>
    <path d="M804.5 438L602.5 210" class="network-path"/>
    <path d="M826 438L707.5 210" class="network-path"/>
    <path d="M847.5 438L812.5 210" class="network-path"/>
    </g>

    <rect x="30" y="265" width="840" height="58" rx="7" class="network-band"/>
    <text x="450" y="300" class="heading mono" text-anchor="middle">NetworkShuffleExec</text>

    <g transform="translate(30 80)">
      <rect width="95" height="130" rx="7" class="consumer"/>
      <text x="47.5" y="25" class="heading" text-anchor="middle">C0</text>
      <rect x="8" y="34" width="79" height="14" class="partition-strip"/>
      <path d="M24 72L18 54M47.5 72V54M71 72L79 54" class="local-fan"/>
      <rect x="5" y="72" width="85" height="30" rx="5" class="local-repartition"/>
      <text x="47.5" y="84" class="tiny mono" text-anchor="middle">local</text>
      <text x="47.5" y="96" class="tiny mono" text-anchor="middle">RepartitionExec</text>
      <path d="M47.5 128V106" class="consumer-input"/>
    </g>
    <g transform="translate(135 80)">
      <rect width="95" height="130" rx="7" class="consumer"/>
      <text x="47.5" y="25" class="heading" text-anchor="middle">C1</text>
      <rect x="8" y="34" width="79" height="14" class="partition-strip"/>
      <path d="M24 72L18 54M47.5 72V54M71 72L79 54" class="local-fan"/>
      <rect x="5" y="72" width="85" height="30" rx="5" class="local-repartition"/>
      <text x="47.5" y="84" class="tiny mono" text-anchor="middle">local</text>
      <text x="47.5" y="96" class="tiny mono" text-anchor="middle">RepartitionExec</text>
      <path d="M47.5 128V106" class="consumer-input"/>
    </g>
    <g transform="translate(240 80)">
      <rect width="95" height="130" rx="7" class="consumer"/>
      <text x="47.5" y="25" class="heading" text-anchor="middle">C2</text>
      <rect x="8" y="34" width="79" height="14" class="partition-strip"/>
      <path d="M24 72L18 54M47.5 72V54M71 72L79 54" class="local-fan"/>
      <rect x="5" y="72" width="85" height="30" rx="5" class="local-repartition"/>
      <text x="47.5" y="84" class="tiny mono" text-anchor="middle">local</text>
      <text x="47.5" y="96" class="tiny mono" text-anchor="middle">RepartitionExec</text>
      <path d="M47.5 128V106" class="consumer-input"/>
    </g>
    <g transform="translate(345 80)">
      <rect width="95" height="130" rx="7" class="consumer"/>
      <text x="47.5" y="25" class="heading" text-anchor="middle">C3</text>
      <rect x="8" y="34" width="79" height="14" class="partition-strip"/>
      <path d="M24 72L18 54M47.5 72V54M71 72L79 54" class="local-fan"/>
      <rect x="5" y="72" width="85" height="30" rx="5" class="local-repartition"/>
      <text x="47.5" y="84" class="tiny mono" text-anchor="middle">local</text>
      <text x="47.5" y="96" class="tiny mono" text-anchor="middle">RepartitionExec</text>
      <path d="M47.5 128V106" class="consumer-input"/>
    </g>
    <g transform="translate(450 80)">
      <rect width="95" height="130" rx="7" class="consumer"/>
      <text x="47.5" y="25" class="heading" text-anchor="middle">C4</text>
      <rect x="8" y="34" width="79" height="14" class="partition-strip"/>
      <path d="M24 72L18 54M47.5 72V54M71 72L79 54" class="local-fan"/>
      <rect x="5" y="72" width="85" height="30" rx="5" class="local-repartition"/>
      <text x="47.5" y="84" class="tiny mono" text-anchor="middle">local</text>
      <text x="47.5" y="96" class="tiny mono" text-anchor="middle">RepartitionExec</text>
      <path d="M47.5 128V106" class="consumer-input"/>
    </g>
    <g transform="translate(555 80)">
      <rect width="95" height="130" rx="7" class="consumer"/>
      <text x="47.5" y="25" class="heading" text-anchor="middle">C5</text>
      <rect x="8" y="34" width="79" height="14" class="partition-strip"/>
      <path d="M24 72L18 54M47.5 72V54M71 72L79 54" class="local-fan"/>
      <rect x="5" y="72" width="85" height="30" rx="5" class="local-repartition"/>
      <text x="47.5" y="84" class="tiny mono" text-anchor="middle">local</text>
      <text x="47.5" y="96" class="tiny mono" text-anchor="middle">RepartitionExec</text>
      <path d="M47.5 128V106" class="consumer-input"/>
    </g>
    <g transform="translate(660 80)">
      <rect width="95" height="130" rx="7" class="consumer"/>
      <text x="47.5" y="25" class="heading" text-anchor="middle">C6</text>
