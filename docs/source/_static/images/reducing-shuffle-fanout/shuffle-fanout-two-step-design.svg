<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Two-step shuffle with producer and consumer fanout</title>
  <desc id="desc">Four producing tasks each create eight task buckets and send one bucket to every consuming task. Each of eight consuming tasks receives four inputs, feeds them into a local RepartitionExec, and fans the data out to 16 local partitions.</desc>

  <defs>
    <marker id="arrow-orange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#b45309"/>
    </marker>
    <marker id="arrow-blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#1677d2"/>
    </marker>
    <pattern id="local-partitions" width="5" height="14" patternUnits="userSpaceOnUse">
      <rect width="4" height="14" fill="#fff" stroke="#1677d2" stroke-width=".55"/>
    </pattern>
    <style>
      .scene{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .section{fill:#57606a;font-size:13px;font-weight:600;letter-spacing:.08em}
      .heading{fill:#24292f;font-size:16px;font-weight:600}
      .label{fill:#3d444d;font-size:14px}
      .small{fill:#667085;font-size:12px}
      .tiny{fill:#57606a;font-size:8px}
      .legend{fill:#57606a;font-size:12px}
      .legend-strong{fill:#3d444d;font-size:12px;font-weight:700}
      .producer{fill:#eaf3ff;stroke:#1677d2;stroke-width:1.4}
      .producer-repartition{fill:#fff;stroke:#1677d2;stroke-width:1.3}
      .consumer{fill:#ecfdf5;stroke:#16856b;stroke-width:1.4}
      .local-repartition{fill:#eef6ff;stroke:#1677d2;stroke-width:1.1}
      .partition-strip{fill:url(#local-partitions);stroke:#1677d2;stroke-width:.7}
      .network-band{fill:#fff8eb;fill-opacity:.96;stroke:#d97706;stroke-width:1.6}
      .network-path{fill:none;stroke:#b45309;stroke-width:1.15;stroke-opacity:.40;marker-end:url(#arrow-orange)}
      .consumer-input{fill:none;stroke:#b45309;stroke-width:1.35;marker-end:url(#arrow-orange)}
      .local-fan{fill:none;stroke:#1677d2;stroke-width:1;marker-end:url(#arrow-blue)}
      .stage-label-bg{fill:#fff;fill-opacity:.94}
    </style>
  </defs>

  <g class="scene">
    <rect width="900" height="570" fill="#fff"/>

    <text x="30" y="30" class="section">TWO-STEP SHUFFLE</text>
    <g transform="translate(320 15)">
      <rect x="0" y="4" width="12" height="12" rx="2" class="producer"/>
      <text x="19" y="15" class="legend">producing task</text>
      <rect x="113" y="4" width="12" height="12" rx="2" class="consumer"/>
      <text x="132" y="15" class="legend">consuming task</text>
      <path d="M242 10H266" class="consumer-input"/>
      <text x="274" y="15" class="legend">network shuffle</text>
      <rect x="387" y="4" width="52" height="12" class="partition-strip"/>
      <text x="447" y="15" class="legend-strong">16 local partitions</text>
    </g>

    <text x="30" y="65" class="heading">Stage 1 · 8 consuming tasks</text>

    <g>
    <path d="M52 438L77.5 210" class="network-path"/>
    <path d="M73.5 438L182.5 210" class="network-path"/>
    <path d="M95 438L287.5 210" class="network-path"/>
    <path d="M116.5 438L392.5 210" class="network-path"/>
    <path d="M138 438L497.5 210" class="network-path"/>
    <path d="M159.5 438L602.5 210" class="network-path"/>
    <path d="M181 438L707.5 210" class="network-path"/>
    <path d="M202.5 438L812.5 210" class="network-path"/>
    <path d="M267 438L77.5 210" class="network-path"/>
