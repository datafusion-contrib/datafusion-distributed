<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">How RepartitionExec becomes a distributed shuffle</title>
  <desc id="desc">On one machine, RepartitionExec hashes rows into 16 local partitions. In Distributed DataFusion, the same rule spans eight consuming tasks with 16 partitions each. Each of four producing tasks therefore creates 128 outputs, and NetworkShuffleExec transfers those outputs between stages.</desc>

  <defs>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#667085"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#b45309"/>
    </marker>
    <style>
      .scene{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .section{fill:#57606a;font-size:13px;font-weight:600;letter-spacing:.08em}
      .heading{fill:#24292f;font-size:16px;font-weight:600}
      .label{fill:#3d444d;font-size:14px}
      .small{fill:#667085;font-size:12px}
      .legend{fill:#57606a;font-size:12px}
      .legend-strong{fill:#3d444d;font-size:12px;font-weight:700}
      .operator{fill:#fff;stroke:#afb8c1;stroke-width:1.3}
      .repartition{fill:#eef6ff;stroke:#1677d2;stroke-width:1.6}
      .producer{fill:#eaf3ff;stroke:#1677d2;stroke-width:1.4}
      .producer-repartition{fill:#fff;stroke:#1677d2;stroke-width:1.3}
      .consumer{fill:#ecfdf5;stroke:#16856b;stroke-width:1.4}
      .shuffle{fill:#fff8eb;stroke:#d97706;stroke-width:1.6}
      .arrow{fill:none;stroke:#667085;stroke-width:1.6;marker-end:url(#arrow-gray)}
      .shuffle-arrow{fill:none;stroke:#b45309;stroke-width:1.8;marker-end:url(#arrow-orange)}
      .divider{stroke:#d8dee4;stroke-width:1.2}
    </style>
  </defs>

  <g class="scene">
    <rect width="900" height="520" fill="#fff"/>

    <text x="30" y="30" class="section">DATAFUSION · ONE MACHINE</text>

    <rect x="30" y="48" width="180" height="62" rx="7" class="operator"/>
    <text x="48" y="76" class="heading">DataSourceExec</text>
    <text x="48" y="97" class="small">N input partitions</text>

    <path d="M220 79H266" class="arrow"/>

    <rect x="276" y="42" width="348" height="74" rx="7" class="repartition"/>
    <text x="296" y="72" class="heading mono">RepartitionExec</text>
    <text x="296" y="97" class="label mono">Hash(key) → 16 local partitions</text>

    <path d="M634 79H680" class="arrow"/>

    <rect x="690" y="48" width="180" height="62" rx="7" class="operator"/>
    <text x="708" y="76" class="heading">Aggregate / Join</text>
    <text x="708" y="97" class="small">matching keys meet</text>

    <line x1="30" y1="140" x2="870" y2="140" class="divider"/>

    <text x="30" y="170" class="section">DISTRIBUTED DATAFUSION</text>

    <g transform="translate(320 155)">
      <rect x="0" y="4" width="12" height="12" rx="2" class="producer"/>
      <text x="19" y="15" class="legend">producing task</text>
      <rect x="113" y="4" width="12" height="12" rx="2" class="consumer"/>
      <text x="132" y="15" class="legend">consuming task</text>
      <path d="M242 10H266" class="shuffle-arrow"/>
      <text x="274" y="15" class="legend">network shuffle</text>
      <text x="387" y="15" class="legend-strong">16 local partitions per task</text>
    </g>

    <text x="30" y="214" class="heading">Stage 1 · 8 consuming tasks</text>

    <g transform="translate(30 230)">
      <rect width="95" height="48" rx="6" class="consumer"/>
      <text x="47.5" y="30" class="heading" text-anchor="middle">C0</text>
    </g>
    <g transform="translate(135 230)">
      <rect width="95" height="48" rx="6" class="consumer"/>
      <text x="47.5" y="30" class="heading" text-anchor="middle">C1</text>
    </g>
    <g transform="translate(240 230)">
      <rect width="95" height="48" rx="6" class="consumer"/>
      <text x="47.5" y="30" class="heading" text-anchor="middle">C2</text>
    </g>
    <g transform="translate(345 230)">
      <rect width="95" height="48" rx="6" class="consumer"/>
      <text x="47.5" y="30" class="heading" text-anchor="middle">C3</text>
    </g>
    <g transform="translate(450 230)">
      <rect width="95" height="48" rx="6" class="consumer"/>
      <text x="47.5" y="30" class="heading" text-anchor="middle">C4</text>
    </g>
    <g transform="translate(555 230)">
      <rect width="95" height="48" rx="6" class="consumer"/>
      <text x="47.5" y="30" class="heading" text-anchor="middle">C5</text>
    </g>
    <g transform="translate(660 230)">
      <rect width="95" height="48" rx="6" class="consumer"/>
      <text x="47.5" y="30" class="heading" text-anchor="middle">C6</text>
    </g>
    <g transform="translate(765 230)">
      <rect width="95" height="48" rx="6" class="consumer"/>
      <text x="47.5" y="30" class="heading" text-anchor="middle">C7</text>
    </g>

    <path d="M77.5 304V286" class="shuffle-arrow"/>
    <path d="M182.5 304V286" class="shuffle-arrow"/>
    <path d="M287.5 304V286" class="shuffle-arrow"/>
    <path d="M392.5 304V286" class="shuffle-arrow"/>
    <path d="M497.5 304V286" class="shuffle-arrow"/>
    <path d="M602.5 304V286" class="shuffle-arrow"/>
    <path d="M707.5 304V286" class="shuffle-arrow"/>
    <path d="M812.5 304V286" class="shuffle-arrow"/>

    <rect x="30" y="304" width="840" height="58" rx="7" class="shuffle"/>
    <text x="450" y="339" class="heading mono" text-anchor="middle">NetworkShuffleExec</text>

    <path d="M127.5 386V370" class="shuffle-arrow"/>
    <path d="M342.5 386V370" class="shuffle-arrow"/>
    <path d="M557.5 386V370" class="shuffle-arrow"/>
    <path d="M772.5 386V370" class="shuffle-arrow"/>

    <g transform="translate(30 386)">
      <rect width="195" height="88" rx="7" class="producer"/>
      <text x="16" y="27" class="heading">P0</text>
      <rect x="16" y="38" width="163" height="38" rx="5" class="producer-repartition"/>
      <text x="97.5" y="55" class="small mono" text-anchor="middle">RepartitionExec</text>
      <text x="97.5" y="70" class="small mono" text-anchor="middle">16 → 128 partitions</text>
    </g>
    <g transform="translate(245 386)">
      <rect width="195" height="88" rx="7" class="producer"/>
      <text x="16" y="27" class="heading">P1</text>
      <rect x="16" y="38" width="163" height="38" rx="5" class="producer-repartition"/>
      <text x="97.5" y="55" class="small mono" text-anchor="middle">RepartitionExec</text>
      <text x="97.5" y="70" class="small mono" text-anchor="middle">16 → 128 partitions</text>
    </g>
    <g transform="translate(460 386)">
      <rect width="195" height="88" rx="7" class="producer"/>
      <text x="16" y="27" class="heading">P2</text>
      <rect x="16" y="38" width="163" height="38" rx="5" class="producer-repartition"/>
      <text x="97.5" y="55" class="small mono" text-anchor="middle">RepartitionExec</text>
      <text x="97.5" y="70" class="small mono" text-anchor="middle">16 → 128 partitions</text>
    </g>
    <g transform="translate(675 386)">
      <rect width="195" height="88" rx="7" class="producer"/>
      <text x="16" y="27" class="heading">P3</text>
      <rect x="16" y="38" width="163" height="38" rx="5" class="producer-repartition"/>
      <text x="97.5" y="55" class="small mono" text-anchor="middle">RepartitionExec</text>
      <text x="97.5" y="70" class="small mono" text-anchor="middle">16 → 128 partitions</text>
    </g>

    <text x="450" y="505" class="label" text-anchor="middle">Stage 0 · 4 producers · fanout per producer: 8 × 16 = 128</text>
  </g>
</svg>
