<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">A direct shuffle creates a route for every destination partition</title>
  <desc id="desc">One producing task owns 16 partial output buffers. Each buffer has an animated red route into NetworkShuffleExec, followed by a separate route to its matching partition across four consuming tasks. Thirty-two network paths make the direct shuffle visibly busy.</desc>

  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#c2410c"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#667085"/>
    </marker>
    <style>
      .scene{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .section{fill:#57606a;font-size:13px;font-weight:700;letter-spacing:.08em}
      .heading{fill:#24292f;font-size:16px;font-weight:700}
      .label{fill:#3d444d;font-size:13px}
      .small{fill:#667085;font-size:11px}
      .tiny{fill:#57606a;font-size:9px}
      .producer{fill:#eaf3ff;stroke:#1677d2;stroke-width:1.4}
      .repartition{fill:#fff;stroke:#1677d2;stroke-width:1.3}
      .buffer-group{fill:#fffbf3;stroke:#f1c27d;stroke-width:1}
      .buffer{fill:#fff8eb;stroke:#d97706;stroke-width:1}
      .consumer-group{fill:#ecfdf5;stroke:#16856b;stroke-width:1.2}
      .partition{fill:#fff;stroke:#16856b;stroke-width:1}
      .network{fill:#fff8eb;stroke:#d97706;stroke-width:1.5}
      .route{fill:none;stroke:#c2410c;stroke-width:1.4;stroke-opacity:.72;marker-end:url(#arrow-red)}
      .buffer-route{stroke-width:1.25;stroke-opacity:.65}
      .producer-route{fill:none;stroke:#667085;stroke-width:1.5;marker-end:url(#arrow-gray)}
      .flow{stroke-dasharray:7 10;animation:flow 2s linear infinite}
      .flow-b{animation-delay:-.5s}.flow-c{animation-delay:-1s}.flow-d{animation-delay:-1.5s}
      .fill{fill:#fb923c;fill-opacity:.25;animation:accumulate 4s ease-in-out infinite}
      .fill-b{animation-delay:-1s}.fill-c{animation-delay:-2s}.fill-d{animation-delay:-3s}
      @keyframes flow{to{stroke-dashoffset:-34}}
      @keyframes accumulate{0%,100%{fill-opacity:.18}50%{fill-opacity:.9}}
      @media (prefers-reduced-motion:reduce){.flow,.fill{animation:none}}
    </style>
  </defs>

  <g class="scene">
    <rect width="1000" height="540" fill="#fff"/>
    <text x="30" y="30" class="section">DIRECT SHUFFLE · ONE ROUTE PER PARTITION</text>
    <text x="970" y="30" class="small" text-anchor="end">small example · T = 4 · P = 4 · fanout = 16</text>

    <rect x="25" y="130" width="175" height="230" rx="9" class="producer"/>
    <text x="112.5" y="164" class="heading" text-anchor="middle">producing task</text>
    <text x="112.5" y="185" class="small" text-anchor="middle">one incoming batch</text>
    <rect x="45" y="207" width="135" height="66" rx="6" class="repartition"/>
    <text x="112.5" y="234" class="label mono" text-anchor="middle">RepartitionExec</text>
    <text x="112.5" y="255" class="small mono" text-anchor="middle">hash(key) → T × P</text>
    <text x="112.5" y="302" class="small" text-anchor="middle">creates 16 partial</text>
    <text x="112.5" y="319" class="small" text-anchor="middle">output buffers</text>
    <path d="M200 245H224" class="producer-route flow"/>

    <text x="295" y="58" class="heading" text-anchor="middle">16 output buffers</text>
    <text x="295" y="72" class="tiny" text-anchor="middle">each holds a small fragment</text>

    <g aria-label="16 partial output buffers">
      <rect x="225" y="80" width="135" height="82" rx="7" class="buffer-group"/>
      <text x="244" y="125" class="heading" text-anchor="middle">T0</text>
      <rect x="265" y="86" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="97" width="82" height="5" rx="2" class="fill"/><text x="306" y="98" class="tiny mono" text-anchor="middle">T0/P0</text>
      <rect x="265" y="105" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="116" width="82" height="5" rx="2" class="fill fill-b"/><text x="306" y="117" class="tiny mono" text-anchor="middle">T0/P1</text>
      <rect x="265" y="124" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="135" width="82" height="5" rx="2" class="fill fill-c"/><text x="306" y="136" class="tiny mono" text-anchor="middle">T0/P2</text>
      <rect x="265" y="143" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="154" width="82" height="5" rx="2" class="fill fill-d"/><text x="306" y="155" class="tiny mono" text-anchor="middle">T0/P3</text>

      <rect x="225" y="170" width="135" height="82" rx="7" class="buffer-group"/>
      <text x="244" y="215" class="heading" text-anchor="middle">T1</text>
      <rect x="265" y="176" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="187" width="82" height="5" rx="2" class="fill fill-b"/><text x="306" y="188" class="tiny mono" text-anchor="middle">T1/P0</text>
      <rect x="265" y="195" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="206" width="82" height="5" rx="2" class="fill fill-c"/><text x="306" y="207" class="tiny mono" text-anchor="middle">T1/P1</text>
      <rect x="265" y="214" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="225" width="82" height="5" rx="2" class="fill fill-d"/><text x="306" y="226" class="tiny mono" text-anchor="middle">T1/P2</text>
      <rect x="265" y="233" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="244" width="82" height="5" rx="2" class="fill"/><text x="306" y="245" class="tiny mono" text-anchor="middle">T1/P3</text>

      <rect x="225" y="260" width="135" height="82" rx="7" class="buffer-group"/>
      <text x="244" y="305" class="heading" text-anchor="middle">T2</text>
      <rect x="265" y="266" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="277" width="82" height="5" rx="2" class="fill fill-c"/><text x="306" y="278" class="tiny mono" text-anchor="middle">T2/P0</text>
      <rect x="265" y="285" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="296" width="82" height="5" rx="2" class="fill fill-d"/><text x="306" y="297" class="tiny mono" text-anchor="middle">T2/P1</text>
      <rect x="265" y="304" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="315" width="82" height="5" rx="2" class="fill"/><text x="306" y="316" class="tiny mono" text-anchor="middle">T2/P2</text>
      <rect x="265" y="323" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="334" width="82" height="5" rx="2" class="fill fill-b"/><text x="306" y="335" class="tiny mono" text-anchor="middle">T2/P3</text>

      <rect x="225" y="350" width="135" height="82" rx="7" class="buffer-group"/>
      <text x="244" y="395" class="heading" text-anchor="middle">T3</text>
      <rect x="265" y="356" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="367" width="82" height="5" rx="2" class="fill fill-d"/><text x="306" y="368" class="tiny mono" text-anchor="middle">T3/P0</text>
      <rect x="265" y="375" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="386" width="82" height="5" rx="2" class="fill"/><text x="306" y="387" class="tiny mono" text-anchor="middle">T3/P1</text>
      <rect x="265" y="394" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="405" width="82" height="5" rx="2" class="fill fill-b"/><text x="306" y="406" class="tiny mono" text-anchor="middle">T3/P2</text>
      <rect x="265" y="413" width="82" height="16" rx="3" class="buffer"/><rect x="265" y="424" width="82" height="5" rx="2" class="fill fill-c"/><text x="306" y="425" class="tiny mono" text-anchor="middle">T3/P3</text>
    </g>

    <g aria-label="16 routes from output buffers into NetworkShuffleExec">
      <path d="M347 94H445" class="route buffer-route flow"/>
      <path d="M347 113H445" class="route buffer-route flow flow-b"/>
      <path d="M347 132H445" class="route buffer-route flow flow-c"/>
      <path d="M347 151H445" class="route buffer-route flow flow-d"/>
      <path d="M347 184H445" class="route buffer-route flow flow-b"/>
      <path d="M347 203H445" class="route buffer-route flow flow-c"/>
      <path d="M347 222H445" class="route buffer-route flow flow-d"/>
      <path d="M347 241H445" class="route buffer-route flow"/>
      <path d="M347 274H445" class="route buffer-route flow flow-c"/>
      <path d="M347 293H445" class="route buffer-route flow flow-d"/>
      <path d="M347 312H445" class="route buffer-route flow"/>
      <path d="M347 331H445" class="route buffer-route flow flow-b"/>
      <path d="M347 364H445" class="route buffer-route flow flow-d"/>
      <path d="M347 383H445" class="route buffer-route flow"/>
      <path d="M347 402H445" class="route buffer-route flow flow-b"/>
      <path d="M347 421H445" class="route buffer-route flow flow-c"/>
    </g>

    <rect x="445" y="80" width="130" height="352" rx="8" class="network"/>
    <text x="510" y="244" class="label mono" text-anchor="middle">Network</text>
    <text x="510" y="265" class="label mono" text-anchor="middle">ShuffleExec</text>
    <text x="510" y="291" class="tiny" text-anchor="middle">16 arrows in</text>
    <text x="510" y="305" class="tiny" text-anchor="middle">16 arrows out</text>

    <text x="802" y="58" class="heading" text-anchor="middle">16 destination partitions</text>
    <text x="802" y="72" class="tiny" text-anchor="middle">four partitions in each consuming task</text>

    <g aria-label="four consuming tasks">
      <rect x="640" y="80" width="330" height="82" rx="7" class="consumer-group"/>
      <rect x="640" y="170" width="330" height="82" rx="7" class="consumer-group"/>
      <rect x="640" y="260" width="330" height="82" rx="7" class="consumer-group"/>
      <rect x="640" y="350" width="330" height="82" rx="7" class="consumer-group"/>

      <rect x="690" y="100" width="62" height="28" rx="4" class="partition"/><rect x="758" y="100" width="62" height="28" rx="4" class="partition"/><rect x="826" y="100" width="62" height="28" rx="4" class="partition"/><rect x="894" y="100" width="62" height="28" rx="4" class="partition"/>
      <rect x="690" y="190" width="62" height="28" rx="4" class="partition"/><rect x="758" y="190" width="62" height="28" rx="4" class="partition"/><rect x="826" y="190" width="62" height="28" rx="4" class="partition"/><rect x="894" y="190" width="62" height="28" rx="4" class="partition"/>
      <rect x="690" y="280" width="62" height="28" rx="4" class="partition"/><rect x="758" y="280" width="62" height="28" rx="4" class="partition"/><rect x="826" y="280" width="62" height="28" rx="4" class="partition"/><rect x="894" y="280" width="62" height="28" rx="4" class="partition"/>
      <rect x="690" y="370" width="62" height="28" rx="4" class="partition"/><rect x="758" y="370" width="62" height="28" rx="4" class="partition"/><rect x="826" y="370" width="62" height="28" rx="4" class="partition"/><rect x="894" y="370" width="62" height="28" rx="4" class="partition"/>
    </g>

    <g aria-label="16 routes from NetworkShuffleExec to their matching destination partitions">
      <path d="M575 88C608 88 608 134 721 134L721 128" class="route flow"/>
      <path d="M575 96C612 96 612 140 789 140L789 128" class="route flow flow-b"/>
      <path d="M575 104C616 104 616 146 857 146L857 128" class="route flow flow-c"/>
      <path d="M575 112C620 112 620 152 925 152L925 128" class="route flow flow-d"/>

      <path d="M575 178C608 178 608 224 721 224L721 218" class="route flow flow-b"/>
      <path d="M575 186C612 186 612 230 789 230L789 218" class="route flow flow-c"/>
      <path d="M575 194C616 194 616 236 857 236L857 218" class="route flow flow-d"/>
      <path d="M575 202C620 202 620 242 925 242L925 218" class="route flow"/>

      <path d="M575 268C608 268 608 314 721 314L721 308" class="route flow flow-c"/>
      <path d="M575 276C612 276 612 320 789 320L789 308" class="route flow flow-d"/>
      <path d="M575 284C616 284 616 326 857 326L857 308" class="route flow"/>
      <path d="M575 292C620 292 620 332 925 332L925 308" class="route flow flow-b"/>

      <path d="M575 358C608 358 608 404 721 404L721 398" class="route flow flow-d"/>
      <path d="M575 366C612 366 612 410 789 410L789 398" class="route flow"/>
      <path d="M575 374C616 374 616 416 857 416L857 398" class="route flow flow-b"/>
      <path d="M575 382C620 382 620 422 925 422L925 398" class="route flow flow-c"/>
    </g>

    <g aria-label="destination partition labels">
      <text x="660" y="126" class="heading" text-anchor="middle">T0</text>
      <text x="721" y="118" class="tiny mono" text-anchor="middle">T0/P0</text><text x="789" y="118" class="tiny mono" text-anchor="middle">T0/P1</text><text x="857" y="118" class="tiny mono" text-anchor="middle">T0/P2</text><text x="925" y="118" class="tiny mono" text-anchor="middle">T0/P3</text>
      <text x="660" y="216" class="heading" text-anchor="middle">T1</text>
      <text x="721" y="208" class="tiny mono" text-anchor="middle">T1/P0</text><text x="789" y="208" class="tiny mono" text-anchor="middle">T1/P1</text><text x="857" y="208" class="tiny mono" text-anchor="middle">T1/P2</text><text x="925" y="208" class="tiny mono" text-anchor="middle">T1/P3</text>
      <text x="660" y="306" class="heading" text-anchor="middle">T2</text>
      <text x="721" y="298" class="tiny mono" text-anchor="middle">T2/P0</text><text x="789" y="298" class="tiny mono" text-anchor="middle">T2/P1</text><text x="857" y="298" class="tiny mono" text-anchor="middle">T2/P2</text><text x="925" y="298" class="tiny mono" text-anchor="middle">T2/P3</text>
      <text x="660" y="396" class="heading" text-anchor="middle">T3</text>
      <text x="721" y="388" class="tiny mono" text-anchor="middle">T3/P0</text><text x="789" y="388" class="tiny mono" text-anchor="middle">T3/P1</text><text x="857" y="388" class="tiny mono" text-anchor="middle">T3/P2</text><text x="925" y="388" class="tiny mono" text-anchor="middle">T3/P3</text>
    </g>

    <line x1="30" y1="462" x2="970" y2="462" stroke="#d8dee4"/>
    <text x="500" y="489" class="label" text-anchor="middle">16 buffer → network routes + 16 network → partition routes for every producing task</text>
    <text x="500" y="514" class="small" text-anchor="middle">At fanout 256, the producer maintains 256 partial buffers and independent partition streams.</text>
  </g>
</svg>
