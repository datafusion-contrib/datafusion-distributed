[package]
name = "datafusion-distributed-iceberg"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Read-only Apache Iceberg table providers for DataFusion Distributed"
license = "Apache-2.0"
repository = "https://github.com/datafusion-contrib/datafusion-distributed"

[features]
# Distributed worker support for the test harness.
integration = ["datafusion-distributed/integration"]

[dependencies]
async-trait = "0.1"
bytes = "1"
datafusion = { workspace = true, features = ["sql"] }
datafusion-iceberg = { git = "https://github.com/apache/datafusion-iceberg.git", rev = "05e277e8a8bf342db53cbf2d53ed6f2098b44a88" }
datafusion-proto = { workspace = true }
futures = "0.3"
iceberg = { git = "https://github.com/apache/iceberg-rust.git", rev = "665c64e48e8d33797ecb1a421f327edd9b024879" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust.git", rev = "665c64e48e8d33797ecb1a421f327edd9b024879", default-features = false, features = ["opendal-fs", "opendal-s3", "opendal-gcs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typetag = "0.2"
datafusion-distributed = { path = "..", features = ["sql"] }
delegate = "0.13"
prost = "0.14.1"
rmp-serde = "1.3"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
insta = "1"
parquet = "59"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
