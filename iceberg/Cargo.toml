[package]
name = "datafusion-distributed-iceberg"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Read-only Apache Iceberg table providers for DataFusion Distributed"
license = "Apache-2.0"
repository = "https://github.com/datafusion-contrib/datafusion-distributed"

[features]
# Distributed worker support for the test harness.
integration = ["datafusion-distributed/integration"]

[dependencies]
async-trait = "0.1"
bytes = "1"
datafusion = { workspace = true, features = ["sql"] }
datafusion-proto = { workspace = true }
futures = "0.3"
iceberg = { git = "https://github.com/apache/iceberg-rust.git", rev = "4d83bc77dc10cff851a3ef427c451ff977bc3643" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust.git", rev = "4d83bc77dc10cff851a3ef427c451ff977bc3643", default-features = false, features = ["opendal-fs", "opendal-s3", "opendal-gcs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typetag = "0.2"
datafusion-distributed = { path = "..", features = ["sql"] }
delegate = "0.13"
prost = "0.14.1"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"

[dev-dependencies]
insta = "1"
parquet = "59"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
