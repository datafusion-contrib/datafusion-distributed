[package]
name = "datafusion-distributed-iceberg"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Read-only Apache Iceberg table providers for DataFusion Distributed"
license = "Apache-2.0"
repository = "https://github.com/datafusion-contrib/datafusion-distributed"

[features]
# Integration tests and public test utilities, including distributed worker support.
integration = ["datafusion-distributed/integration"]

[dependencies]
async-trait = "0.1"
bytes = "1"
datafusion = { workspace = true, features = ["sql"] }
datafusion-proto = { workspace = true }
# Match datafusion-iceberg's iceberg-rust revision so FileScanTask has one shared type.
iceberg-datafusion = { git = "https://github.com/apache/datafusion-iceberg.git", rev = "b3d4edcc975046d624f7c5b17e7f27843f15afcc" }
futures = "0.3"
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "8cb2adeddb4f8da1ca7bd86ca303337f011c12e2" }
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "8cb2adeddb4f8da1ca7bd86ca303337f011c12e2", default-features = false, features = ["opendal-fs", "opendal-s3", "opendal-gcs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
typetag = "0.2"
datafusion-distributed = { path = "..", features = ["sql"] }
delegate = "0.13"
prost = "0.14.1"
rmp-serde = "1.3"
tokio = { version = "1.48", features = ["full"] }
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
insta = "1"
parquet = "59"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
