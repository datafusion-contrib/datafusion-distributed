syntax = "proto3";
package iceberg;

message IcebergDataSource {
  DataFusionSchema schema = 1;
  WorkUnitFeed feed = 2;
  DataFusionPartitioning partitioning = 3;
  optional uint64 fetch = 4;
  map<string, string> storage_properties = 5;
  EagerScan eager = 6; // Exclusive with the legacy lazy scan fields.
}

message WorkUnitFeed {
  bytes id = 1;
}

// The generated Rust fields use DataFusion's canonical protobuf types.
message DataFusionSchema {}
message DataFusionPartitioning {}

message EagerScan {
  DataFusionFileScanConfig config = 1;
  // One complete task per file entry, in file-group iteration order.
  repeated bytes tasks = 2;
  bool may_filter_rows = 3;
  bool row_group_filtering_enabled = 4;
  bool row_selection_enabled = 5;
  uint64 data_file_concurrency_limit = 6;
}
message DataFusionFileScanConfig {}
