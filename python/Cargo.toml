[package]
name = "datafusion-distributed-python"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
datafusion = { workspace = true }
datafusion-proto = { workspace = true }
datafusion-ffi = "55"
datafusion-python = { git = "https://github.com/apache/datafusion-python", rev = "59c1fd1e93705d982b5bb4e9ce37da60a467fff8", default-features = false, features = ["abi3"] }
datafusion-python-util = { git = "https://github.com/apache/datafusion-python", rev = "59c1fd1e93705d982b5bb4e9ce37da60a467fff8" }
datafusion-distributed = { path = ".." }
log = "0.4"
pyo3 = { version = "0.29", features = ["extension-module", "abi3", "abi3-py310"] }
pyo3-log = "0.13.3"
tokio = { version = "1.48", features = ["net", "sync"] }
tokio-stream = { version = "0.1.17", features = ["net"] }
tonic = { version = "0.14.1", features = ["transport"] }
url = "2.5.7"

[build-dependencies]
pyo3-build-config = "0.29"

[lib]
name = "_internal"
crate-type = ["cdylib", "rlib"]
