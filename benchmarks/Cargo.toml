[package]
name = "datafusion-distributed-benchmarks"
version = "0.1.0"
edition = "2024"
default-run = "dfbench"

[dependencies]
async-trait = "0.1.89"
axum = "0.8"
datafusion = { workspace = true }
datafusion-distributed = { path = "..", features = [
  "integration",
  "system-metrics",
] }
tokio = { version = "1.48", features = ["full"] }
url = "2.5.7"
parquet = { version = "59" }
structopt = { version = "0.3.26" }
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
env_logger = "0.11.8"
futures = "0.3.31"
arrow = { version = "59", features = ["test_utils"] }
tonic = { version = "0.14.1", features = ["transport"] }
tpchgen = { git = "https://github.com/clflushopt/tpchgen-rs", rev = "f42708c32e7fd816b8ad8d2a880c1802a71b669f" }
tpchgen-arrow = { git = "https://github.com/clflushopt/tpchgen-rs", rev = "f42708c32e7fd816b8ad8d2a880c1802a71b669f" }
reqwest = "0.12"
zip = "6.0"
sketches-ddsketch = "0.3"
object_store = { version = "0.13", features = ["aws"] }
openssl = { version = "0.10", features = ["vendored"] }
mimalloc = "0.1"

[features]
# Gates for the dataset test suites under `tests/`. They live here rather than in the library
# because, as a dev-dependency of the library, this crate re-enables `grpc` on every test build
# through feature unification, which made the no-grpc config untestable.
tpch = []
tpcds = []
clickbench = []
slow-tests = []

[dev-dependencies]
criterion = "0.5"
sysinfo = "0.30"
pretty_assertions = "1.4"
test-case = "3.3.1"

[build-dependencies]
built = { version = "0.8", features = ["git2", "chrono"] }

[[bin]]
name = "dfbench"
path = "src/main.rs"

[[bench]]
name = "broadcast_cache_scenarios"
harness = false

[[bench]]
name = "shuffle"
harness = false

[[bench]]
name = "local_repartition"
harness = false

[[bench]]
name = "transport"
harness = false
