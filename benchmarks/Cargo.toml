[package]
name = "datafusion-distributed-benchmarks"
version = "0.1.0"
edition = "2024"
default-run = "dfbench"

[dependencies]
async-trait = "0.1.89"
axum = "0.8"
datafusion = { workspace = true }
datafusion-distributed = { path = "..", features = [
  "integration",
  "system-metrics",
] }
tokio = { version = "1.48", features = ["full"] }
url = "2.5.7"
parquet = { version = "58" }
structopt = { version = "0.3.26" }
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
env_logger = "0.11.8"
futures = "0.3.31"
arrow = { version = "58", features = ["test_utils"] }
tonic = { version = "0.14.1", features = ["transport"] }
tpchgen = { git = "https://github.com/clflushopt/tpchgen-rs", rev = "438e9c2dbc25b2fff82c0efc08b3f13b5707874f" }
tpchgen-arrow = { git = "https://github.com/clflushopt/tpchgen-rs", rev = "438e9c2dbc25b2fff82c0efc08b3f13b5707874f" }
tpcdsgen = { git = "https://github.com/clflushopt/tpchgen-rs", rev = "438e9c2dbc25b2fff82c0efc08b3f13b5707874f" }
reqwest = "0.12"
zip = "6.0"
sketches-ddsketch = "0.3"
object_store = { version = "0.13", features = ["aws"] }
openssl = { version = "0.10", features = ["vendored"] }
mimalloc = "0.1"

[dev-dependencies]
criterion = "0.5"
sysinfo = "0.30"

[build-dependencies]
built = { version = "0.8", features = ["git2", "chrono"] }

[[bin]]
name = "dfbench"
path = "src/main.rs"

[[bench]]
name = "broadcast_cache_scenarios"
harness = false

[[bench]]
name = "shuffle"
harness = false

[[bench]]
name = "local_repartition"
harness = false

[[bench]]
name = "transport"
harness = false
