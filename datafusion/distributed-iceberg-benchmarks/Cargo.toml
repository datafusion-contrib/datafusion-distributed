[package]
name = "datafusion-distributed-iceberg-benchmarks"
version = "0.1.0"
edition = "2024"
default-run = "dfbench-iceberg"
publish = false

[dependencies]
async-trait = "0.1.89"
datafusion = { workspace = true, features = ["parquet", "sql"] }
datafusion-datasets = { path = "../datasets" }
datafusion-distributed-benchmarks = { path = "../distributed-benchmarks" }
datafusion-distributed-iceberg = { path = "../distributed-iceberg" }
env_logger = "0.11.8"
futures = "0.3.31"
parquet = "59"
serde_json = "1"
structopt = "0.3.26"
tokio = { version = "1.48", features = ["full"] }
url = "2.5.7"

[dev-dependencies]
criterion = "0.5"
datafusion-proto = { workspace = true }
prost = "0.14.1"

[[bin]]
name = "dfbench-iceberg"
path = "src/main.rs"

[[bench]]
name = "eager_scan_codec"
harness = false
