[package]
name = "datafusion-datasets"
version = "0.1.0"
edition = "2024"
description = "TPC-H, TPC-DS and ClickBench dataset generation for DataFusion Distributed benchmarks and tests"
publish = false

[dependencies]
datafusion = { workspace = true, features = ["parquet"] }
tokio = { version = "1.48", features = ["full"] }
parquet = { version = "59" }
structopt = { version = "0.3.26" }
futures = "0.3.31"
indicatif = "0.18"
arrow = { version = "59" }
tpchgen = { git = "https://github.com/clflushopt/tpchgen-rs", rev = "f42708c32e7fd816b8ad8d2a880c1802a71b669f" }
tpchgen-arrow = { git = "https://github.com/clflushopt/tpchgen-rs", rev = "f42708c32e7fd816b8ad8d2a880c1802a71b669f" }
tpcdsgen = { git = "https://github.com/clflushopt/tpchgen-rs", rev = "f42708c32e7fd816b8ad8d2a880c1802a71b669f" }
tpcdsgen-arrow = { git = "https://github.com/clflushopt/tpchgen-rs", rev = "f42708c32e7fd816b8ad8d2a880c1802a71b669f" }
reqwest = "0.12"
object_store = { version = "0.13", features = ["aws"] }
aws-config = "1"
aws-credential-types = "1"
url = "2"
tempfile = "3"
