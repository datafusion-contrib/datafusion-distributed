[package]
name = "datafusion-distributed-benchmark-worker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.89"
axum = "0.7"
datafusion = { workspace = true }
datafusion-distributed = { path = "../../..", features = [
  "integration",
  "system-metrics",
] }
datafusion-distributed-benchmarks = { path = "../../../benchmarks-local" }
env_logger = "0.11.8"
futures = "0.3.31"
log = "0.4.27"
mimalloc = "0.1"
object_store = { version = "0.13", features = ["aws"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1.0.219", features = ["derive"] }
structopt = "0.3.26"
tokio = { version = "1.48", features = ["full"] }
tonic = { version = "0.14.1", features = ["transport"] }
url = "2.5.7"

[build-dependencies]
built = { version = "0.8", features = ["git2", "chrono"] }
