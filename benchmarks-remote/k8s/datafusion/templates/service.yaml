apiVersion: v1
kind: Service
metadata:
  name: datafusion
  namespace: benchmark-datafusion
spec:
  selector:
    app.kubernetes.io/name: datafusion-worker
  ports:
    - name: http
      port: 9000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: datafusion-workers
  namespace: benchmark-datafusion
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: datafusion-worker
  ports:
    - name: grpc
      port: 9001
      targetPort: grpc
