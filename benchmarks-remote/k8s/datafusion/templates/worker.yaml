apiVersion: apps/v1
kind: Deployment
metadata:
  name: datafusion-worker
  namespace: benchmark-datafusion
  labels:
    app.kubernetes.io/name: datafusion-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: datafusion-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datafusion-worker
    spec:
      serviceAccountName: benchmark-engine
      nodeSelector:
        karpenter.sh/nodepool: general-purpose
        node.kubernetes.io/instance-type: {{ .Values.worker.instanceType | quote }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: datafusion-worker
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: download-worker
          image: {{ .Values.worker.artifactImage | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - aws s3 cp {{ required "worker.artifact is required" .Values.worker.artifact | quote }} /opt/benchmark/worker && chmod 0755 /opt/benchmark/worker
          volumeMounts:
            - name: worker-binary
              mountPath: /opt/benchmark
      containers:
        - name: worker
          image: {{ .Values.worker.runtimeImage | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /opt/benchmark/worker
          args:
            - --bucket
            - {{ required "worker.datasetBucket is required" .Values.worker.datasetBucket | quote }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: AWS_REGION
              value: us-east-1
          ports:
            - name: http
              containerPort: 9000
            - name: grpc
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /info
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml (required "workerResources is required" .Values.workerResources) | nindent 12 }}
          volumeMounts:
            - name: worker-binary
              mountPath: /opt/benchmark
      volumes:
        - name: worker-binary
          emptyDir: {}
