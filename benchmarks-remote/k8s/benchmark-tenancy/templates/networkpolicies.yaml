apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: benchmark-namespace-ingress
  namespace: {{ .Values.systemNamespace }}
  labels:
    {{- include "benchmark-tenancy.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
{{- range .Values.engines }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: benchmark-namespace-ingress
  namespace: benchmark-{{ . }}
  labels:
    {{- include "benchmark-tenancy.labels" $ | nindent 4 }}
    benchmark.datafusion.apache.org/engine: {{ . }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
{{- end }}
